<style>
.tb{border:2px solid rgba(255,255,255,.5);border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:16px;font-weight:bold;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none}
.tb:active{background:rgba(255,255,255,.3)}

<script>
// Touch controls
const _touch={left:false,right:false,up:false,down:false,atk:false,jmp:false,sp2:false,sp3:false,sup:false};
function _tbind(id,key){
  const el=document.getElementById(id);
  if(!el)return;
  el.addEventListener('touchstart',e=>{e.preventDefault();_touch[key]=true},{passive:false});
  el.addEventListener('touchend',  e=>{e.preventDefault();_touch[key]=false},{passive:false});
  el.addEventListener('mousedown', e=>{_touch[key]=true});
  el.addEventListener('mouseup',   e=>{_touch[key]=false});
}
// ── Character Select ─────────────────────────────────────
const CDATA={
  RYOKEN:{name:'RYOKEN',sub:'Guerrier Équilibré',col:'#2ee8ff',glow:'#7ef5ff',hp:1000,
    desc:['⚡ Fireball (Z+R)','🔥 Uppercut Dragon (↑SP)','💫 Slide Éclair (↓SP)','★ Tempête Totale (SUPER)']},
  KIRA:{name:'KIRA',sub:'Rushdown Flamboyant',col:'#ff5522',glow:'#ffaa44',hp:950,
    desc:['🔥 Dash Infernal (Z+R)','⬆ Uppercut Flamme (↑SP)','💣 Boule de Feu (↓SP)','★ Tornade Infernale (SUPER)']},
};
let _selPhase=0,_selP1=0,_selP2=1;
const _ckeys=Object.keys(CDATA);

function showCharSel(phase){
  _selPhase=phase;
  const el=document.getElementById('charsel');
  const acol=phase===0?'#2ee8ff':'#ff5522';
  document.getElementById('cs-title').textContent=phase===0?'CHOISIS TON PERSONNAGE':"CHOISIS L'ADVERSAIRE";
  document.getElementById('cs-title').style.color=acol;
  document.getElementById('cs-sub').textContent='Appuie sur CHOISIR';
  document.getElementById('cs-sub').style.color=acol;
  const p1el=document.getElementById('cs-p1');
  if(phase===1){p1el.style.display='block';p1el.textContent='Ton perso : '+CDATA[_ckeys[_selP1]].name;p1el.style.color=CDATA[_ckeys[_selP1]].col}
  else p1el.style.display='none';
  const cards=document.getElementById('cs-cards');
  cards.innerHTML='';
  _ckeys.forEach((cn,i)=>{
    const D=CDATA[cn];
    const div=document.createElement('div');
    div.style.cssText=`width:148px;border-radius:12px;border:2px solid ${D.col};background:rgba(6,0,20,.97);color:#fff;display:flex;flex-direction:column;align-items:center;padding:14px 10px 12px;box-sizing:border-box`;
    div.innerHTML=`
      <div style="font:bold 22px Impact;color:${D.col};text-shadow:0 0 10px ${D.glow};margin-bottom:3px">${D.name}</div>
      <div style="font-size:9px;color:${D.glow};margin-bottom:10px;text-align:center">${D.sub}</div>
      <div style="font-size:9px;color:#aaa;text-align:left;line-height:1.8;width:100%;margin-bottom:8px">${D.desc.map(d=>'<div>'+d+'</div>').join('')}</div>
      <div style="font-size:9px;color:#555;margin-bottom:10px">HP : ${D.hp}</div>
      <button style="width:100%;padding:10px 0;border-radius:20px;border:none;background:${D.col};color:#000;font:bold 14px Impact;cursor:pointer;letter-spacing:1px">CHOISIR</button>`;
    div.querySelector('button').onclick=()=>{
      if(_selPhase===0){_selP1=i;showCharSel(1)}
      else{_selP2=i;hideCharSel();startGame(_selP1,_selP2)}
    };
    cards.appendChild(div);
  });
  el.style.display='block';
}
function hideCharSel(){document.getElementById('charsel').style.display='none'}
function startGame(i1,i2){
  const g=window._game;if(!g)return;
  // Rebuild fighters with selected chars
  const cn1=_ckeys[i1],cn2=_ckeys[i2];
  // Update CHARS reference if needed then rebuild
  g.p1cn=cn1;g.p2cn=cn2;
  g._buildWith(cn1,cn2);g._reset();g.state='INTRO';g.introF=160;
}

window.addEventListener('load',()=>{
  const tc=document.getElementById('tc');
  // Show on touch device
  if('ontouchstart' in window||navigator.maxTouchPoints>0) tc.style.display='block';
  _tbind('tl','left');_tbind('tr','right');_tbind('tu','up');_tbind('td','down');
  _tbind('tatk','atk');_tbind('tsp2','sp2');_tbind('tsp3','sp3');_tbind('tsup','sup');
});
</script>
<script>
'use strict';
const W=960,H=540,FLOOR=430,SL=70,SR=890;
const G=0.42;        // gravity plus douce = arc plus naturel
const JV=-13.5;      // saut moins violent
const WF=3.2;        // marche avant plus lente
const WB=2.6;        // marche arriere plus lente
const ACC=0.28;      // acceleration progressive
const DEC=0.88;      // deceleration avec inertie
const AIR_DEC=0.97;  // peu de friction en l'air

// ── States ──────────────────────────────────────────────────
const S={IDLE:'I',WF:'WF',WB:'WB',CR:'CR',JU:'JU',JF:'JF',JB:'JB',
  LP:'LP',MP:'MP',HP:'HP',CL:'CL',CM:'CM',CH:'CH',JA:'JA',
  SP1:'S1',SP2:'S2',SP3:'S3',SUP:'SU',
  BH:'BH',BL:'BL',HIT:'HT',KD:'KD',GU:'GU',KO:'KO'};

// ── Input (clavier + manette DualSense) ─────────────────────
const _gpStore={pad:null};
window.addEventListener('gamepadconnected',   e=>{_gpStore.pad=e.gamepad;console.log('GP:',e.gamepad.id)});
window.addEventListener('gamepaddisconnected',e=>{_gpStore.pad=null});

class Input{
  constructor(){
    this.h=new Set();this.p=new Set();this._b=new Set();
    this._gpPrev={};
    window.addEventListener('keydown',e=>{if(!this.h.has(e.code))this._b.add(e.code);this.h.add(e.code);e.preventDefault()});
    window.addEventListener('keyup',e=>this.h.delete(e.code));
  }
  _gp(){
    // Polling direct avec try/catch — fonctionne sur GitHub Pages et PS5
    try{
      const gps=navigator.getGamepads?navigator.getGamepads():[];
      for(const g of gps) if(g){if(!_gpStore.pad)_gpStore.pad=g;return g;}
    }catch(e){}
    return null;
  }
  flush(){
    this.p=new Set(this._b);this._b.clear();
    const g=this._gp();if(!g)return;
    const map={
      'GP_LEFT': !!g.buttons[14]?.pressed,
      'GP_RIGHT':!!g.buttons[15]?.pressed,
      'GP_UP':   !!g.buttons[12]?.pressed,
      'GP_DOWN': !!g.buttons[13]?.pressed,
      'GP_ATK':  !!g.buttons[1]?.pressed,  // Rond
      'GP_JUMP': !!g.buttons[0]?.pressed,  // Croix
      'GP_SP2':  !!g.buttons[5]?.pressed,  // R1
      'GP_SP3':  !!g.buttons[3]?.pressed,  // Triangle
      'GP_SUP':  !!g.buttons[7]?.pressed,  // R2
      'GP_START':!!g.buttons[9]?.pressed,  // Options
    };
    for(const[k,v] of Object.entries(map)){
      if(v&&!this._gpPrev[k]){this._b.add(k);this.h.add(k)}
      else if(!v){this.h.delete(k)}
    }
    this._gpPrev={...map};
  }
  hk(k){return this.h.has(k)} pk(k){return this.p.has(k)}
  get hasGamepad(){return !!this._gp()}
}
// AZERTY keys
const KB={left:'KeyQ',right:'KeyD',up:'KeyZ',down:'KeyS',atk:'KeyR'};
// Gamepad virtual keys
const GP={left:'GP_LEFT',right:'GP_RIGHT',up:'GP_UP',down:'GP_DOWN',atk:'GP_ATK',jump:'GP_JUMP',sp2:'GP_SP2',sp3:'GP_SP3',sup:'GP_SUP',start:'GP_START'};

// Simple combo buffer: detect near-simultaneous presses for specials
class SpecialBuf{
  constructor(im){this.im=im;this.buf=[];this.f=0}
  tick(){
    this.f++;
    const keys=['KeyZ','KeyS','KeyR','GP_UP','GP_DOWN','GP_ATK'];
    for(const k of keys) if(this.im.pk(k)) this.buf.push({k,f:this.f});
    if(this.buf.length>20) this.buf=this.buf.slice(-20);
  }
  _since(win){return this.buf.filter(b=>this.f-b.f<win)}
  hasAll(keys,win=8){const r=this._since(win);return keys.every(k=>r.some(b=>b.k===k))}
  hasSub(k,win=6){return this._since(win).some(b=>b.k===k)}
  clear(){this.buf=[]}
}

// ── Particles ────────────────────────────────────────────────
class Pt{
  constructor(x,y,vx,vy,l,r,c,g=0.18,decay=0.93){
    Object.assign(this,{x,y,vx,vy,l,ml:l,r,c,g,decay,ring:false,rr:0})
  }
  tick(){this.x+=this.vx;this.y+=this.vy;this.vy+=this.g;this.vx*=this.decay;this.l--;return this.l>0}
  get a(){return this.l/this.ml}
}
class Pts{
  constructor(){this.list=[]}
  burst(x,y,n,cols,spd=7,rl=[2,7],grav=0.22){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2,s=spd*(0.3+Math.random()*0.9);
      const r=rl[0]+Math.random()*(rl[1]-rl[0]);
      this.list.push(new Pt(x,y,Math.cos(a)*s,Math.sin(a)*s,16+Math.random()*16,r,cols[i%cols.length],grav));
    }
  }
  spark(x,y,n,c,dx=0){
    for(let i=0;i<n;i++){
      const a=-Math.PI/2+(Math.random()-0.5)*2;const s=3+Math.random()*6;
      const p=new Pt(x,y,Math.cos(a)*s+dx*1.2,Math.sin(a)*s-1,9+~~(Math.random()*10),1.5+Math.random()*2.5,c,0.3,0.88);
      this.list.push(p);
    }
  }
  ring(x,y,c){const p=new Pt(x,y,0,0,22,0,c,0,1);p.ring=true;p.rr=0;this.list.push(p)}
  trail(x,y,c,r=3){this.list.push(new Pt(x,y,(Math.random()-.5),(Math.random()-.5),14,r,c,-0.03,0.9))}
  tick(){this.list=this.list.filter(p=>p.tick())}
  draw(ctx){
    for(const p of this.list){
      ctx.save();ctx.globalAlpha=p.a*0.92;
      if(p.ring){
        ctx.strokeStyle=p.c;ctx.lineWidth=2.5;
        ctx.shadowBlur=10;ctx.shadowColor=p.c;
        ctx.globalAlpha=p.a*0.65;
        ctx.beginPath();ctx.arc(p.x,p.y,p.rr,0,Math.PI*2);ctx.stroke();
        p.rr+=(1-p.a)*55+1.5;
      } else {
        ctx.shadowBlur=7;ctx.shadowColor=p.c;
        ctx.fillStyle=p.c;
        ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
      }
      ctx.restore();
    }
  }
}

// ── Screen FX ────────────────────────────────────────────────
class SFX{
  constructor(){this.sk=0;this.sx=0;this.sy=0;this.fi=0;this.fc=null;this.fa=0;this.hs=0;this.sl=0}
  shake(i,d){this.sk=d;this._si=i}
  flash(c,a=0.5,d=8){this.fc=c;this.fa=a;this.fi=d;this._fd=d}
  hitStop(f=5){this.hs=Math.max(this.hs,f)}
  slow(d=80){this.sl=d}
  get frozen(){return this.hs>0}
  get slowing(){return this.sl>0}
  tick(){
    if(this.sk>0){this.sk--;this.sx=(Math.random()-.5)*this._si*2.2;this.sy=(Math.random()-.5)*this._si*1.5}
    else{this.sx=0;this.sy=0}
    if(this.fi>0){this.fi--;this.fa=0.55*(this.fi/this._fd)}
    if(this.hs>0)this.hs--;if(this.sl>0)this.sl--;
  }
  apply(ctx){ctx.translate(this.sx,this.sy)}
  drawFlash(ctx){
    if(this.fi>0&&this.fc){ctx.save();ctx.globalAlpha=this.fa;ctx.fillStyle=this.fc;ctx.fillRect(0,0,W,H);ctx.restore()}
  }
}

// ── Projectile ───────────────────────────────────────────────
class Proj{
  constructor(x,y,dir,oid,c){
    this.x=x;this.y=y;this.vx=dir*(c.spd||8);this.vy=c.vy||0;
    this.oid=oid;this.dmg=c.dmg||80;this.w=c.w||36;this.h=c.h||22;
    this.col=c.col||'#4af';this.glow=c.glow||'#9ef';this.type=c.type||'e';
    this.life=c.life||115;this.active=true;
  }
  get hb(){return{x:this.x-this.w/2,y:this.y-this.h/2,w:this.w,h:this.h}}
  tick(){this.x+=this.vx;this.y+=this.vy;this.life--;if(this.life<=0||this.x<-80||this.x>W+80)this.active=false}
  draw(ctx,pts,T){
    if(!this.active)return;
    ctx.save();ctx.shadowBlur=24;ctx.shadowColor=this.glow;
    if(this.type==='e'){
      const g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.w*.7);
      g.addColorStop(0,'#fff');g.addColorStop(0.3,this.glow);g.addColorStop(1,this.col+'00');
      ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(this.x,this.y,this.w*.7,this.h*.6,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(this.x,this.y,this.w*.22,0,Math.PI*2);ctx.fill();
    } else {
      for(let i=2;i>=0;i--){
        const ox=i*8*(this.vx>0?-1:1);
        ctx.globalAlpha=0.88-i*0.25;ctx.fillStyle=i===0?'#fff':this.col;
        ctx.beginPath();ctx.ellipse(this.x+ox,this.y+Math.sin(T*13+i)*2.5,this.w*.5-i*5,this.h*.42,0,0,Math.PI*2);ctx.fill();
      }
    }
    ctx.restore();
    if(Math.random()<0.4)pts.trail(this.x-this.vx*2.5,this.y,this.glow,3.5);
  }
}

// ── Move table ───────────────────────────────────────────────
function mv(su,ac,re,dmg,kx,ky,hbs,p={}){return{su,ac,re,dmg,kx,ky,hbs,p}}
const RYOKEN_MOVES={

  [S.MP]: mv(6,5,12, 98, 6,-2,[{ox:52,oy:52,w:68,h:34}]),
  [S.HP]: mv(10,6,19,155,9,-5,[{ox:54,oy:48,w:80,h:40}]),
  [S.CL]: mv(3,3,8,  46, 3, 0,[{ox:42,oy:18,w:52,h:20}],{low:1}),
  [S.CM]: mv(6,4,13, 86, 5, 0,[{ox:48,oy:28,w:62,h:24}],{low:1}),

  [S.SUP]:mv(18,44,38,340,12,-2,[{ox:0,oy:70,w:800,h:95}],{sup:1,multi:5}),
};
const CHARS={
  RYOKEN:{name:'RYOKEN',sub:'Guerrier Équilibré',col:'#2ee8ff',col2:'#0a6090',glow:'#7ef5ff',
    shadow:'#1a5070',trim:'#ffffff',hp:1000,moves:RYOKEN_MOVES,eCost:100},
  KIRA:{name:'KIRA',sub:'Rushdown Flamboyant',col:'#ff5522',col2:'#992210',glow:'#ffaa44',
    shadow:'#6b2000',trim:'#ffdd44',hp:950,moves:KIRA_MOVES,eCost:100},

// ── Color helpers ────────────────────────────────────────
function _lighten(hex,amt){
  const n=parseInt(hex.slice(1),16);
  const r=Math.min(255,(n>>16)+amt),g=Math.min(255,((n>>8)&0xff)+amt),b=Math.min(255,(n&0xff)+amt);
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function _darken(hex,amt){return _lighten(hex,-amt)}
function _drawArm(ctx,C,len,ghost,front){
  const tg=ctx.createLinearGradient(-5,0,5,0);
  const col=front?C.col:C.col2;
  tg.addColorStop(0,col);tg.addColorStop(.4,_lighten(col,20));tg.addColorStop(1,col);
  ctx.fillStyle=tg;ctx.shadowBlur=ghost?0:6;ctx.shadowColor=C.glow;
  ctx.beginPath();rr(ctx,-5,0,10,len*.55,4);ctx.fill();
  // Elbow joint
  if(!ghost){ctx.fillStyle='rgba(255,255,255,.12)';ctx.beginPath();ctx.arc(0,len*.52,4,0,Math.PI*2);ctx.fill()}
  // Forearm
  ctx.save();ctx.translate(0,len*.55);ctx.rotate(front?.05:-.05);
  ctx.fillStyle=tg;ctx.beginPath();rr(ctx,-4.5,0,9,len*.45,3);ctx.fill();
  // Glove/fist
  ctx.save();ctx.translate(0,len*.45);
  ctx.fillStyle=_darken(col,15);ctx.beginPath();rr(ctx,-6,0,12,10,3);ctx.fill();
  ctx.fillStyle=C.trim;ctx.beginPath();rr(ctx,-5,8,10,3,1);ctx.fill();
  ctx.restore();ctx.restore();
}
// ── Fighter ──────────────────────────────────────────────────
class Fighter{
  constructor(id,cn,sx,fr,isHuman){
    this.id=id;this.cn=cn;this.C=CHARS[cn];
    this.x=sx;this.y=FLOOR;this.vx=0;this.vy=0;this.tvx=0;this.fr=fr; // tvx = target velocity
    this.w=48;this.h=118;
    this.hp=this.C.hp;this.mhp=this.C.hp;this.dhp=this.C.hp;
    this.en=0;this.men=100;
    this.st=S.IDLE;this.sT=0;
    this.hf=0;this.inv=0;
    this.cb=0;this.cbdmg=0;this.cbT=0;
    this.hmv=false;this.hcnt=0;this.lhT=0;
    this.projs=[];this.aimgs=[];
    this.isHuman=isHuman;
    if(isHuman){this.im=new Input();this.sb=new SpecialBuf(this.im)}
  }
  get grnd(){return this.y>=FLOOR}
  get air(){return !this.grnd}
  isAtk(){return[S.LP,S.MP,S.HP,S.CL,S.CM,S.CH,S.JA,S.SP1,S.SP2,S.SP3,S.SUP].includes(this.st)}
  isBlk(){return this.st===S.BH||this.st===S.BL}
  isKO(){return this.st===S.KO}
  isHurt(){return[S.HIT,S.KD,S.GU].includes(this.st)}
  get mv(){return this.C.moves[this.st]}
  get hbs(){
    const m=this.mv;if(!m||!m.hbs.length)return[];
    if(this.sT<m.su||this.sT>=m.su+m.ac)return[];
    if(this.hmv&&!m.p.multi)return[];
    if(this.hmv&&m.p.multi&&this.hcnt>=m.p.multi)return[];
    if(this.hmv&&this.sT-this.lhT<5)return[];
    const d=this.fr?1:-1;
    return m.hbs.map(h=>({x:this.x+d*h.ox-(this.fr?0:h.w),y:this.y-h.oy-h.h,w:h.w,h:h.h}));
  }
  get hurt(){
    if(this.inv>0||this.isKO())return null;
    const cr=[S.CR,S.BL,S.CL,S.CM,S.CH].includes(this.st);
    const h=cr?this.h*.62:this.h;
    return{x:this.x-this.w/2,y:this.y-h,w:this.w,h};
  }
  go(ns){
    if(this.st===ns)return;this.st=ns;this.sT=0;this.hmv=false;this.hcnt=0;
    if(ns===S.SP2){this.vy=-17;if(this.grnd)this.y=FLOOR-1;if(this.mv?.p.inv)this.inv=this.mv.p.inv}
    if(ns===S.SP1&&this.cn==='KIRA'){this.vx=this.fr?14:-14}
    if(ns===S.SP3&&this.cn==='RYOKEN'){this.vx=this.fr?9:-9}
    if(ns===S.SUP){this.en=0}
  }
  recHit(m,aFR,pts){
    if(this.inv>0||this.isKO())return false;
    const blk=this._blk(m,aFR);
    this.hf=8;const kd=aFR?1:-1;
    if(blk){this.hp=Math.max(0,this.hp-Math.floor(m.dmg*.08));this.en=Math.min(this.men,this.en+4);this.vx=kd*m.kx*.4;this.sT=0;return true}
    this.hp=Math.max(0,this.hp-m.dmg);
    this.en=Math.min(this.men,this.en+m.dmg*.14);
    if(m.p.kd||m.p.sup||this.hp<=0){
      this.go(this.hp<=0?S.KO:S.KD);this.vx=kd*m.kx*1.3;this.vy=-6;
    } else {this.go(S.HIT);this.vx=kd*m.kx;this.vy=m.ky<0?m.ky:0}
    const hx=this.x,hy=this.y-this.h*.55;
    pts.spark(hx,hy,15,this.C.col,kd);pts.burst(hx,hy,9,['#fff','#ff8',this.C.glow],5.5,[2,6]);pts.ring(hx,hy,this.C.glow);
    return true;
  }
  _blk(m,aFR){
    if(!this.isBlk()||this.air||this.fr===aFR)return false;
    if(m.p.low&&this.st!==S.BL)return false;
    if(m.p.ovhd&&this.st===S.BL)return false;
    return true;
  }

  // ── Human input — Clavier AZERTY ou Manette DualSense ──
  handleInput(opp){
    if(!this.isHuman)return;
    const im=this.im,sb=this.sb;
    im.flush();sb.tick();
    if(this.isKO()||this.isHurt())return;
    if(this.isAtk()){const m=this.mv;if(m&&this.sT<m.su+m.ac+m.re)return;if(this.grnd)this.go(S.IDLE);return}
    // Directions — clavier OU manette
    const T=typeof _touch!=='undefined'?_touch:{};
    const dn =im.hk(KB.down) ||im.hk(GP.down) ||!!T.down;
    const up_ =im.hk(KB.up)  ||im.hk(GP.up)   ||!!T.up;
    const lft =im.hk(KB.left) ||im.hk(GP.left) ||!!T.left;
    const rgt =im.hk(KB.right)||im.hk(GP.right)||!!T.right;
    // Boutons attaque
    const atkP=im.pk(KB.atk) ||im.pk(GP.atk)||!!T.atk;
    const supP=im.pk(GP.sup)||!!T.sup;
    const sp2P=im.pk(GP.sp2)||!!T.sp2;
    const sp3P=im.pk(GP.sp3)||!!T.sp3;
    const jupP=im.pk(GP.jump)||!!T.jmp;
    const fwd=this.fr?rgt:lft,bck=this.fr?lft:rgt;

    // SUPER direct (R1 manette ou Z+S+R clavier)
    if((supP||(atkP&&sb.hasAll(['KeyZ','KeyS','KeyR'],12)))&&this.en>=this.C.eCost){
      sb.clear();this.go(S.SUP);return;
    }
    // Uppercut direct (Rond manette ou Z+R clavier)
    if(sp2P||(atkP&&sb.hasAll(['KeyZ','KeyR'],10))){
      sb.clear();this.go(S.SP2);return;
    }
    // Special bas (Triangle manette ou S+R clavier)
    if(sp3P||(atkP&&dn)){sb.clear();this._sp3();return}
    // Attaque saut
    if(atkP&&this.air){this.go(S.JA);return}
    // Attaque sol
    if(atkP&&this.grnd){this.go(S.HP);return}
    // Garde : tenir direction arriere
    if(this.grnd&&bck){this.go(dn?S.BL:S.BH);return}
    // Mouvements
    if(this.grnd){
      const jmp=up_||jupP;
      if(jmp){this._jump(fwd,bck);return}
      if(dn){this.go(S.CR);return}
      if(fwd){this.go(S.WF);return}
      if(bck){this.go(S.WB);return}
      this.go(S.IDLE);
    }
  }
  _sp1(){
    if(this.cn==='RYOKEN'){
      this.go(S.SP1);const d=this.fr?1:-1;
      this.projs.push(new Proj(this.x+d*44,this.y-74,d,this.id,{spd:9,dmg:85,w:36,h:24,col:'#2ee8ff',glow:'#9ef',type:'e',life:110}));
    } else {this.go(S.SP1)}
  }
  _sp3(){
    if(this.cn==='RYOKEN'){this.go(S.SP3)}
    else{
      this.go(S.SP3);const d=this.fr?1:-1;
      this.projs.push(new Proj(this.x+d*30,this.y-64,d,this.id,{spd:5.5,dmg:70,w:52,h:52,col:'#ff5522',glow:'#fa8',type:'f',life:90}));
    }
  }
  _jump(fwd,bck){
    // Preserve horizontal momentum when jumping
    const baseVx=this.vx;
    this.vy=JV;this.y=FLOOR-1;
    if(fwd){
      this.go(S.JF);
      // Blend current momentum with jump direction
      const jvx=this.fr?WF*1.1:-WF*1.1;
      this.vx=baseVx*0.4+jvx*0.6;
    } else if(bck){
      this.go(S.JB);
      const jvx=this.fr?-WB*1.1:WB*1.1;
      this.vx=baseVx*0.4+jvx*0.6;
    } else {
      this.go(S.JU);
      this.vx=baseVx*0.3; // carry some momentum in neutral jump
    }
  }

  // ── Tick ──
  tick(opp,pts){
    this.sT++;
    if(this.hf>0)this.hf--;if(this.inv>0)this.inv--;
    if(this.cbT>0)this.cbT--;else if(this.cb>0){this.cb=0;this.cbdmg=0}
    if(this.dhp>this.hp)this.dhp=Math.max(this.hp,this.dhp-2.8);
    if([S.SP1,S.SUP].includes(this.st)&&this.sT%2===0)this.aimgs.push({x:this.x,y:this.y,fr:this.fr,a:.42});
    this.aimgs=this.aimgs.filter(a=>{a.a-=0.065;return a.a>0});
    this.projs=this.projs.filter(p=>{p.tick();return p.active});
    this._stLogic(opp,pts);this._phys();
    if([S.IDLE,S.WF,S.WB,S.CR,S.BH,S.BL].includes(this.st))this.fr=this.x<opp.x;
    this.x=Math.max(SL+this.w/2,Math.min(SR-this.w/2,this.x));
  }
  _stLogic(opp,pts){
    const m=this.mv;
    // Smooth velocity: interpolate toward target
    const lerp=(a,b,t)=>a+(b-a)*t;
    switch(this.st){
      case S.WF:
        // Rapide au début, lisse à vitesse max
        {const tv=this.fr?WF:-WF;this.vx=lerp(this.vx,tv,0.55);}break;
      case S.WB:
        {const tv=this.fr?-WB:WB;this.vx=lerp(this.vx,tv,0.5);}break;
      case S.IDLE:
        this.vx=lerp(this.vx,0,0.18);break;
      case S.CR:
        this.vx=lerp(this.vx,0,0.16);break;
      case S.BH:case S.BL:
        this.vx=lerp(this.vx,0,0.18);
        if(this.isHuman){const b=this.fr?this.im.hk(KB.left):this.im.hk(KB.right);if(!b)this.go(S.IDLE)}
        break;
      case S.HIT:
        this.vx*=0.88;
        if(this.sT>28&&this.grnd)this.go(S.IDLE);break;
      case S.KD:
        if(this.grnd){this.vx*=0.62;if(this.sT>70&&this.hp>0){this.go(S.GU);this.inv=24}}break;
      case S.GU:
        this.vx=lerp(this.vx,0,0.12);
        if(this.sT>35)this.go(S.IDLE);break;
      case S.SP1:
        if(this.cn==='KIRA'&&this.sT<=22)this.vx=lerp(this.vx,this.fr?11:-11,0.35);
        else this.vx=lerp(this.vx,0,0.12);
        if(m&&this.sT>=m.su+m.ac+m.re&&this.grnd)this.go(S.IDLE);break;
      case S.SP2:
        this.vx=lerp(this.vx,0,0.08);
        if(m&&this.sT>=m.su+m.ac+m.re&&this.grnd)this.go(S.IDLE);break;
      case S.SP3:
        if(this.cn==='RYOKEN'&&this.sT<16)this.vx=lerp(this.vx,this.fr?8:-8,0.3);
        else this.vx=lerp(this.vx,0,0.1);
        if(m&&this.sT>=m.su+m.ac+m.re&&this.grnd)this.go(S.IDLE);break;
      case S.SUP:
        this.vx=lerp(this.vx,0,0.06);
        if(m&&this.sT>=m.su+m.ac+m.re&&this.grnd)this.go(S.IDLE);break;
      default:
        this.vx=lerp(this.vx,0,0.1);
        if(m&&this.sT>=m.su+m.ac+m.re&&this.grnd)this.go(S.IDLE);break;
    }
  }
  _phys(){
    // Realistic gravity: apply always, landing smoothed
    this.vy+=G;
    // Air resistance on horizontal
    if(this.air) this.vx*=AIR_DEC;
    this.x+=this.vx;this.y+=this.vy;
    if(this.y>=FLOOR){
      this.y=FLOOR;
      // Soft landing: dampen vertical
      if(this.vy>0) this.vy=0;
      if([S.JU,S.JF,S.JB,S.JA].includes(this.st)){
        this.go(S.IDLE);
        this.vx*=0.55; // conserve some momentum on landing
      }
      if(this.st===S.SP2)this.go(S.IDLE);
      if(this.st===S.KD)this.vx*=0.5;
    }
  }

  // ─── DRAWING ─────────────────────────────────────────────
  draw(ctx,pts,T){
    for(const ai of this.aimgs){
      ctx.save();ctx.globalAlpha=ai.a*.4;
      this._drawChar(ctx,ai.x,ai.y,ai.fr,T,true);ctx.restore();
    }
    ctx.save();
    if(this.hf>0&&this.hf%2===0)ctx.filter='brightness(8) saturate(0)';
    else if(this.st===S.SUP){
      // Super: draw twice — glow copy then normal
      ctx.save();ctx.globalAlpha=0.35+Math.sin(T*18)*.15;
      ctx.filter=`drop-shadow(0 0 8px ${this.C.glow})`;
      this._drawChar(ctx,this.x+Math.sin(T*22)*3,this.y,this.fr,T,true);ctx.restore();
    }
    else if(this.inv>0&&this.inv%3===0)ctx.globalAlpha=0.4;
    this._drawChar(ctx,this.x,this.y,this.fr,T,false);
    ctx.restore();
    for(const p of this.projs)p.draw(ctx,pts,T);
  }

  _drawChar(ctx,x,y,fr,T,ghost){
    const C=this.C,d=fr?1:-1,st=this.st,t=this.sT;
    let lean=0,squat=0,armAng=0,legAng=0,stretch=0,jf=0,headTilt=0;
    const breath=Math.sin(T*1.4)*2.2;
    const blend=Math.min(1,t/6);

    // Attack direction arrow
    if(!ghost&&this.isAtk()&&this.mv){
      const mv=this.mv;
      if(t>=mv.su&&t<mv.su+mv.ac){
        const ax=x+d*65,ay=y-this.h*.55;
        ctx.save();ctx.globalAlpha=0.8;
        ctx.strokeStyle=C.glow;ctx.lineWidth=3;ctx.shadowBlur=12;ctx.shadowColor=C.glow;
        ctx.beginPath();ctx.moveTo(ax-d*20,ay);ctx.lineTo(ax+d*20,ay);
        ctx.moveTo(ax+d*11,ay-9);ctx.lineTo(ax+d*20,ay);ctx.lineTo(ax+d*11,ay+9);
        ctx.stroke();ctx.restore();
      }
    }

    switch(st){
      case S.IDLE:   lean=Math.sin(T*1.2)*1.2;headTilt=Math.sin(T*.9)*.8;break;
      case S.WF:     lean=d*5+Math.sin(T*7)*1.5;legAng=Math.sin(T*7)*18;armAng=Math.sin(T*7+Math.PI)*16;headTilt=Math.sin(T*7)*.8;break;
      case S.WB:     lean=-d*4+Math.sin(T*6)*1.2;legAng=Math.sin(T*6)*14;armAng=Math.sin(T*6+Math.PI)*12;break;
      case S.CR:case S.BL:case S.CL:case S.CM:case S.CH: squat=28;lean=d*4;headTilt=-2;break;
      case S.JU:case S.JF:case S.JB: stretch=-10;lean=d*8;armAng=-35;legAng=-18;jf=-8;break;
      case S.JA:     stretch=-6;armAng=d*75;legAng=14;jf=-5;break;
      case S.LP:     lean=d*(t<5?22*blend:5);armAng=d*(t<5?80*blend:12);headTilt=d*3*blend;break;
      case S.MP:     lean=d*(t<8?32*blend:9);armAng=d*(t<8?110*blend:18);headTilt=d*5*blend;break;
      case S.HP:     lean=d*(t<11?44*blend:14);armAng=d*(t<11?135*blend:25);headTilt=d*7*blend;break;
      case S.BH:     lean=-d*10;armAng=-26;headTilt=d*(-4);break;
      case S.SP1:
        if(this.cn==='KIRA'){lean=d*28;armAng=d*45}
        else{lean=d*12;armAng=d*(t<12?65:14)}headTilt=d*6;break;
      case S.SP2:    stretch=t<8?-20:-8;armAng=d*(t<8?-20:-40);lean=d*(t<8?8:2);headTilt=t<8?-8:2;break;
      case S.SP3:    squat=16;lean=d*32;legAng=d*55;headTilt=d*8;break;
      case S.SUP:    lean=d*(Math.sin(T*16)*5);armAng=100+Math.sin(T*12)*28;stretch=-4;break;
      case S.HIT:    lean=-d*32;headTilt=-d*6;break;
      case S.KD:case S.KO: lean=-d*105;squat=42;break;
    }

    const base=y-4+breath+jf;
    const TH=56-squat*.4;
    const cr=[S.CR,S.BL,S.CL,S.CM,S.CH].includes(st);

    ctx.save();ctx.translate(x,base);

    // Special glow
    if(!ghost){
      if(st===S.SUP){ctx.shadowBlur=28;ctx.shadowColor=C.glow}
      else if(st===S.SP2){ctx.shadowBlur=18;ctx.shadowColor='#ff8820'}
      else if(st===S.SP1||st===S.SP3){ctx.shadowBlur=14;ctx.shadowColor=C.glow}
    }

    // Drop shadow on ground
    if(!ghost){
      const sh=Math.max(0,1-(FLOOR-y)/200);
      ctx.save();ctx.globalAlpha=.4*sh;
      ctx.fillStyle='rgba(0,0,0,.6)';
      ctx.beginPath();ctx.ellipse(0,FLOOR-base,this.w*1.4*(.5+sh*.5),5,0,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }

    // ── LEGS ──
    const lA=(legAng+(cr?15:0))*Math.PI/180;
    for(let i=0;i<2;i++){
      const s=i===0?1:-1;
      ctx.save();ctx.translate(s*d*9+lean*.12,0);
      ctx.rotate(s===1?lA:-lA*.55);
      // Thigh — tapered
      const thighH=cr?20:32;
      const tg1=ctx.createLinearGradient(-7,0,7,0);
      tg1.addColorStop(0,C.col2);tg1.addColorStop(.4,_lighten(C.col2,25));tg1.addColorStop(1,C.col2);
      ctx.fillStyle=tg1;
      ctx.beginPath();rr(ctx,-7,0,14,thighH,4);ctx.fill();
      // Knee highlight
      if(!ghost){ctx.fillStyle='rgba(255,255,255,.15)';ctx.beginPath();ctx.arc(0,thighH-4,4,0,Math.PI*2);ctx.fill()}
      // Shin
      ctx.save();ctx.translate(0,thighH);ctx.rotate(s===1?lA*.35:-lA*.25);
      const tg2=ctx.createLinearGradient(-6,0,6,0);
      tg2.addColorStop(0,C.col2);tg2.addColorStop(.45,_lighten(C.col2,15));tg2.addColorStop(1,C.col2);
      ctx.fillStyle=tg2;
      ctx.beginPath();rr(ctx,-6,0,12,cr?12:24,3);ctx.fill();
      // Boot
      ctx.save();ctx.translate(0,cr?12:24);
      ctx.fillStyle=_darken(C.col,20);
      ctx.beginPath();rr(ctx,-8,-2,16,11,3);ctx.fill();
      // Boot toe — lighter
      ctx.fillStyle=C.trim;ctx.beginPath();rr(ctx,-8,7,16,4,2);ctx.fill();
      // Boot highlight
      if(!ghost){ctx.fillStyle='rgba(255,255,255,.2)';ctx.beginPath();rr(ctx,-7,-1,8,4,2);ctx.fill()}
      ctx.restore();ctx.restore();ctx.restore();
    }

    // ── TORSO ──
    ctx.save();ctx.rotate(lean*Math.PI/180*.28);
    // Body gradient — 3D look
    const tg=ctx.createLinearGradient(-20,-TH-squat*.2,20,-TH-squat*.2+TH);
    tg.addColorStop(0,_lighten(C.col,15));tg.addColorStop(.45,C.col);tg.addColorStop(1,C.col2);
    ctx.fillStyle=tg;
    ctx.shadowBlur=ghost?0:8;ctx.shadowColor=C.glow;
    ctx.beginPath();rr(ctx,-18,-TH-squat*.25,36,TH,8);ctx.fill();ctx.shadowBlur=0;
    // Muscle detail lines
    if(!ghost&&!cr&&TH>30){
      ctx.save();ctx.globalAlpha=.18;
      ctx.strokeStyle=_lighten(C.col,40);ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(-5,-TH+10);ctx.lineTo(-5,-14);ctx.stroke();
      ctx.beginPath();ctx.moveTo(5,-TH+10);ctx.lineTo(5,-14);ctx.stroke();
      ctx.beginPath();ctx.moveTo(-12,-TH*.4);ctx.quadraticCurveTo(-16,-TH*.55,-13,-TH*.7);ctx.stroke();
      ctx.beginPath();ctx.moveTo(12,-TH*.4);ctx.quadraticCurveTo(16,-TH*.55,13,-TH*.7);ctx.stroke();
      ctx.restore();
    }
    // Belt
    const beltY=-12;
    ctx.fillStyle=_darken(C.col,30);ctx.beginPath();rr(ctx,-18,beltY,36,9,2);ctx.fill();
    ctx.fillStyle=C.trim+'aa';ctx.beginPath();rr(ctx,-4,beltY+1,8,7,2);ctx.fill();// buckle
    // Chest armor/trim
    if(!ghost){
      ctx.fillStyle=C.col+'66';ctx.beginPath();rr(ctx,-11,-TH-squat*.25+7,22,16,4);ctx.fill();
      ctx.strokeStyle=C.glow+'88';ctx.lineWidth=1;ctx.beginPath();rr(ctx,-11,-TH-squat*.25+7,22,16,4);ctx.stroke();
    }
    ctx.restore();

    // ── BACK ARM ──
    ctx.save();ctx.rotate(lean*Math.PI/180*.28);
    ctx.translate(-d*14,-TH+12-squat*.14);
    ctx.rotate(-armAng*Math.PI/180*.16);
    _drawArm(ctx,C,28,ghost,false);
    ctx.restore();

    // ── FRONT ARM ──
    ctx.save();ctx.rotate(lean*Math.PI/180*.28);
    ctx.translate(d*14,-TH+12-squat*.14);
    ctx.rotate(armAng*Math.PI/180*.34);
    _drawArm(ctx,C,32,ghost,true);
    // Fist glow during attack
    if(Math.abs(armAng)>35&&!ghost){
      ctx.save();ctx.translate(0,34);
      ctx.shadowBlur=18;ctx.shadowColor=C.glow;
      ctx.fillStyle=C.glow;ctx.globalAlpha=.6;
      ctx.beginPath();ctx.arc(0,0,8,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;ctx.restore();
    }
    ctx.restore();

    // ── HEAD ──
    const hY=-TH-squat*.25-32+stretch*.3;
    ctx.save();ctx.translate(d*3,hY);
    ctx.rotate((lean*Math.PI/180*.12)+(headTilt*Math.PI/180*.5));
    ctx.shadowBlur=ghost?0:14;ctx.shadowColor=C.glow;
    // Neck
    const neckG=ctx.createLinearGradient(-4,0,4,0);
    neckG.addColorStop(0,'#a07050');neckG.addColorStop(.5,'#c89070');neckG.addColorStop(1,'#a07050');
    ctx.fillStyle=neckG;ctx.beginPath();rr(ctx,-5,2,10,9,2);ctx.fill();
    if(this.cn==='RYOKEN')this._headR(ctx,C,ghost,T,d);
    else this._headK(ctx,C,ghost,T,d);
    ctx.restore();

    ctx.restore(); // main
  }
