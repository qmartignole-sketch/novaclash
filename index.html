<script>
// Touch controls
const _touch={left:false,right:false,up:false,down:false,atk:false,jmp:false,sp2:false,sp3:false,sup:false};
function _tbind(id,key){
  const el=document.getElementById(id);
  if(!el)return;
  el.addEventListener('touchstart',e=>{e.preventDefault();_touch[key]=true},{passive:false});
  el.addEventListener('touchend',  e=>{e.preventDefault();_touch[key]=false},{passive:false});
  el.addEventListener('mousedown', e=>{_touch[key]=true});
  el.addEventListener('mouseup',   e=>{_touch[key]=false});
}
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// MULTIPLAYER — PeerJS peer-to-peer matchmaking
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
let _mp={
  peer:null, conn:null, isHost:false,
  searching:false, connected:false,
  timerEl:null, ringCtx:null, timerInt:null,
  inputBuf:[], remoteInput:{},
  myChar:0, oppChar:1,
};

function _roomCode(){
  // Rotating slot changes every 30s — auto-matches nearby players
  return 'NC-'+(Math.floor(Date.now()/30000)%9999).toString().padStart(4,'0');
}
function _customCode(v){return 'NC-USER-'+v.toUpperCase().replace(/[^A-Z0-9]/g,'')}

function _startMatchmaking(){
  const overlay=document.getElementById('matchmaking');
  overlay.style.display='flex';
  _mp.searching=true;
  _mp.connected=false;
  // Setup ring canvas
  const rc=document.getElementById('mm-ring');
  _mp.ringCtx=rc.getContext('2d');
  _mp.timeLeft=10;
  _drawRing(10,10);
  _setStatus('Recherche en cours...');
  // Cleanup old peer
  if(_mp.peer){try{_mp.peer.destroy()}catch(e){}}
  // Try auto-match slot
  const roomId=_roomCode();
  _tryHostOrJoin(roomId);
  // Timer
  _mp.timerInt=setInterval(()=>{
    _mp.timeLeft--;
    _drawRing(_mp.timeLeft,10);
    document.getElementById('mm-timer').textContent=_mp.timeLeft;
    if(_mp.timeLeft<=0&&!_mp.connected){
      clearInterval(_mp.timerInt);
      _setStatus('Aucun joueur trouvé. En attente...');
      // Show room code to share
      const codeEl=document.getElementById('mm-code');
      const codeVal=document.getElementById('mm-code-val');
      if(codeEl){codeEl.style.display='block'}
      if(codeVal){codeVal.textContent=roomId.replace('NC-','')}
      document.getElementById('mm-timer').textContent='∞';
    }
  },1000);
  // Cancel & join buttons
  document.getElementById('mm-cancel').onclick=()=>_cancelMatchmaking();
  document.getElementById('mm-join').onclick=()=>{
    const v=document.getElementById('mm-input').value.trim();
    if(v.length>=2){
      if(_mp.peer){try{_mp.peer.destroy()}catch(e){}}
      _mp.timeLeft=30;
      _tryJoinCode(_customCode(v));
    }
  };
}

function _tryHostOrJoin(roomId){
  // Try to be host first
  _setStatus('Connexion au serveur...');
  const peer=new Peer(roomId,{debug:0});
  _mp.peer=peer;
  peer.on('open',id=>{
    _mp.isHost=true;
    _setStatus("En attente d'un adversaire...");
    peer.on('connection',conn=>{_onConnect(conn,true)});
  });
  peer.on('error',err=>{
    // ID taken = someone is already waiting, connect to them
    if(err.type==='unavailable-id'||err.type==='peer-unavailable'){
      _tryJoinCode(roomId);
    } else {
      _setStatus('Erreur: '+err.type);
    }
  });
}

function _tryJoinCode(roomId){
  _setStatus("onnexion à l'adversaire...'");
  const peer=new Peer(undefined,{debug:0});
  _mp.peer=peer;
  peer.on('open',()=>{
    const conn=peer.connect(roomId,{reliable:true,serialization:'json'});
    conn.on('open',()=>_onConnect(conn,false));
    conn.on('error',e=>_setStatus('Impossible de rejoindre ce code'));
  });
  peer.on('error',e=>_setStatus('Erreur connexion: '+e.type));
}

function _onConnect(conn,isHost){
  if(_mp.connected)return;
  clearInterval(_mp.timerInt);
  _mp.conn=conn;_mp.isHost=isHost;_mp.connected=true;_mp.searching=false;
  document.getElementById('mm-timer').textContent='✓';
  document.getElementById('mm-code').style.display='none';
  const foundEl=document.getElementById('mm-found');
  foundEl.style.display='block';
  foundEl.textContent=isHost?'ADVERSAIRE TROUVÉ !':'CONNECTÉ !';
  _setStatus(isHost?'Tu joues en BLEU (P1)':'Tu joues en ROUGE (P2)');
  conn.on('data',_onRemoteData);
  conn.on('close',()=>_onDisconnect());
  // Flash then start char select
  setTimeout(()=>{
    document.getElementById('matchmaking').style.display='none';
    // Go to char select, not directly to game
    _startMultiGame();
  },1800);
}

function _onRemoteData(data){
  if(data.type==='charsel'){
    _mp.oppChar=data.char;
    _mp.remoteReady=true;
    if(_mp.localReady){
      _launchMulti();
    } else {
      // Update VS display if we're still on wait screen
      _updateWaitVS&&_updateWaitVS();
    }
  }
  if(data.type==='input'){
    _mp.remoteInput=data.inp;
  }
}

function _onDisconnect(){
  if(window._game){

function _startMultiGame(){
  if(!window._game)return;
  window._game._multiMode=true;
  _mp.localReady=false;_mp.remoteReady=false;
  _mp.myChar=0;
  _showMultiCharSel();
}

function _showMultiCharSel(){
  // Show dedicated multi charsel overlay
  document.getElementById('multi-charsel').style.display='block';
  document.getElementById('multi-wait').style.display='none';
  const role=document.getElementById('mcs-role');
  if(role)role.textContent=_mp.isHost?'TU JOUES EN BLEU (P1)':'TU JOUES EN ROUGE (P2)';
  const cards=document.getElementById('mcs-cards');
  if(!cards)return;
  cards.innerHTML='';
  Object.entries(CHARS).forEach(([cn,C],i)=>{
    const div=document.createElement('div');
    div.style.cssText='width:148px;border-radius:12px;border:2px solid '+C.col+';background:rgba(6,0,24,.97);color:#fff;display:flex;flex-direction:column;align-items:center;padding:14px 10px 12px;box-sizing:border-box;cursor:pointer';
    div.innerHTML='<div style="font-family:Impact;font-size:22px;color:'+C.col+';text-shadow:0 0 8px '+C.glow+';margin-bottom:4px">'+C.name+'</div>'
      +'<div style="font-size:9px;color:'+C.glow+';margin-bottom:8px;text-align:center">'+C.sub+'</div>'
      +'<div style="font-size:9px;color:#aaa;text-align:left;line-height:1.7;width:100%;margin-bottom:8px">'+(C.desc||[]).map(d=>'<div>• '+d+'</div>').join('')+'</div>'
      +'<div style="font-size:9px;color:#444;margin-bottom:10px">HP: '+C.hp+'</div>'
      +'<button style="width:100%;padding:10px 0;border-radius:20px;border:none;background:'+C.col+';color:#000;font-family:Impact;font-size:14px;cursor:pointer;letter-spacing:1px">CHOISIR</button>';
    div.querySelector('button').onclick=()=>{
      _mp.myChar=i;
      // Send choice to opponent
      if(_mp.conn)_mp.conn.send({type:'charsel',char:i});
      _mp.localReady=true;
      // Switch to waiting screen
      document.getElementById('multi-charsel').style.display='none';
      document.getElementById('multi-wait').style.display='flex';
      // Update VS display
      _updateWaitVS();
      // If opponent already chose, launch
      if(_mp.remoteReady)_launchMulti();
    };
    cards.appendChild(div);
  });
}

function _updateWaitVS(){
  const ckeys=Object.keys(CHARS);
  const mine=CHARS[ckeys[_mp.myChar]||ckeys[0]];
  const vs=document.getElementById('mw-vs');
  if(!vs||!mine)return;
  vs.innerHTML='<div style="text-align:center"><div style="font-size:10px;color:#555;letter-spacing:2px;margin-bottom:6px">TOI</div><div style="font-family:Impact;font-size:20px;color:'+mine.col+';text-shadow:0 0 8px '+mine.glow+'">'+mine.name+'</div></div>'
    +'<div style="font-size:26px;color:#333">VS</div>'
    +'<div style="text-align:center" id="mw-opp"><div style="font-size:10px;color:#555;letter-spacing:2px;margin-bottom:6px">ADVERSAIRE</div><div style="font-family:Impact;font-size:20px;color:#444">???</div></div>';
}

function _hideWaitingForOpponent(){
  document.getElementById('multi-wait').style.display='none';
  document.getElementById('multi-charsel').style.display='none';
}

function _launchMulti(){
  const g=window._game;if(!g)return;
  const ckeys=Object.keys(CHARS);
  const host=_mp.isHost;
  const myChar=ckeys[_mp.myChar]||ckeys[0];
  const oppChar=ckeys[_mp.oppChar]||ckeys[1];
  const p1char=host?myChar:oppChar;
  const p2char=host?oppChar:myChar;
  // Show opponent in VS screen
  const opp=CHARS[host?oppChar:myChar];
  const mine=CHARS[host?myChar:oppChar];
  const vs=document.getElementById('mw-vs');
  if(vs&&opp){
    vs.innerHTML='<div style="text-align:center"><div style="font-size:10px;color:#555;letter-spacing:2px;margin-bottom:6px">TOI</div><div style="font-family:Impact;font-size:20px;color:'+mine.col+';text-shadow:0 0 8px '+mine.glow+'">'+mine.name+'</div></div>'
      +'<div style="font-size:26px;color:#22ff88">VS</div>'
      +'<div style="text-align:center"><div style="font-size:10px;color:#555;letter-spacing:2px;margin-bottom:6px">ADVERSAIRE</div><div style="font-family:Impact;font-size:20px;color:'+opp.col+';text-shadow:0 0 8px '+opp.glow+'">'+opp.name+'</div></div>';
  }
  const status=document.getElementById('mw-status');
  if(status)status.textContent='Adversaire pret ! Lancement...';
  const spinner=document.querySelector('#multi-wait div[style*="spin"]');
  if(spinner)spinner.style.display='none';
  // Launch after showing VS
  setTimeout(()=>{
    // Hide ALL multi overlays
    ['multi-charsel','multi-wait','matchmaking','mp-waiting','charsel'].forEach(id=>{
      const el=document.getElementById(id);if(el)el.style.display='none';
    });
    g._buildWith(p1char,p2char);g._reset();
    g._multiMode=true;g._multiIsHost=host;
    g.state='INTRO';g.introF=160;
  },1600);
}

  _mp.searching=false;_mp.connected=false;
  document.getElementById('matchmaking').style.display='none';

}

function _drawRing(t,max){
  const ctx=_mp.ringCtx;if(!ctx)return;
  ctx.clearRect(0,0,120,120);
  const cx=60,cy=60,r=50;
  // BG ring
  ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=8;
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();
  // Progress ring
  const prog=(t/max)*Math.PI*2;
  const col=t>5?'#22ff88':t>2?'#ffa020':'#ff4444';
  ctx.strokeStyle=col;ctx.lineWidth=8;ctx.shadowBlur=12;ctx.shadowColor=col;
  ctx.lineCap='round';
  ctx.beginPath();ctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+prog);ctx.stroke();
  ctx.shadowBlur=0;
}

class Input{
  constructor(){
    this.h=new Set();this.p=new Set();this._b=new Set();
    this._gpPrev={};
    window.addEventListener('keydown',e=>{if(!this.h.has(e.code))this._b.add(e.code);this.h.add(e.code);e.preventDefault()});
    window.addEventListener('keyup',e=>this.h.delete(e.code));
  }
  _gp(){
    // Polling direct avec try/catch — fonctionne sur GitHub Pages et PS5
    try{
      const gps=navigator.getGamepads?navigator.getGamepads():[];
      for(const g of gps) if(g){if(!_gpStore.pad)_gpStore.pad=g;return g;}
    }catch(e){}
    return null;
  }
  flush(){
    this.p=new Set(this._b);this._b.clear();
    const g=this._gp();if(!g)return;
    const map={
      'GP_LEFT': !!g.buttons[14]?.pressed,
      'GP_RIGHT':!!g.buttons[15]?.pressed,
      'GP_UP':   !!g.buttons[12]?.pressed,
      'GP_DOWN': !!g.buttons[13]?.pressed,
      'GP_ATK':  !!g.buttons[1]?.pressed,  // Rond
      'GP_JUMP': !!g.buttons[0]?.pressed,  // Croix
      'GP_SP2':  !!g.buttons[5]?.pressed,  // R1
      'GP_SP3':  !!g.buttons[3]?.pressed,  // Triangle
      'GP_SUP':  !!g.buttons[7]?.pressed,  // R2
      'GP_START':!!g.buttons[9]?.pressed,  // Options
    };
    for(const[k,v] of Object.entries(map)){
      if(v&&!this._gpPrev[k]){this._b.add(k);this.h.add(k)}
      else if(!v){this.h.delete(k)}
    }
    this._gpPrev={...map};
  }
  hk(k){return this.h.has(k)} pk(k){return this.p.has(k)}
  get hasGamepad(){return !!this._gp()}
}

// Simple combo buffer: detect near-simultaneous presses for specials
class SpecialBuf{
  constructor(im){this.im=im;this.buf=[];this.f=0}
  tick(){
    this.f++;
    const keys=['KeyZ','KeyS','KeyR','GP_UP','GP_DOWN','GP_ATK'];
    for(const k of keys) if(this.im.pk(k)) this.buf.push({k,f:this.f});
    if(this.buf.length>20) this.buf=this.buf.slice(-20);
  }
  _since(win){return this.buf.filter(b=>this.f-b.f<win)}
  hasAll(keys,win=8){const r=this._since(win);return keys.every(k=>r.some(b=>b.k===k))}
  hasSub(k,win=6){return this._since(win).some(b=>b.k===k)}
  clear(){this.buf=[]}
}

// ── Particles ────────────────────────────────────────────────
class Pt{
  constructor(x,y,vx,vy,l,r,c,g=0.18,decay=0.93){
    Object.assign(this,{x,y,vx,vy,l,ml:l,r,c,g,decay,ring:false,rr:0})
  }
  tick(){this.x+=this.vx;this.y+=this.vy;this.vy+=this.g;this.vx*=this.decay;this.l--;return this.l>0}
  get a(){return this.l/this.ml}
}
class Pts{
  constructor(){this.list=[]}
  burst(x,y,n,cols,spd=7,rl=[2,7],grav=0.22){
    for(let i=0;i<n;i++){
      const a=Math.random()*Math.PI*2,s=spd*(0.3+Math.random()*0.9);
      const r=rl[0]+Math.random()*(rl[1]-rl[0]);
      this.list.push(new Pt(x,y,Math.cos(a)*s,Math.sin(a)*s,16+Math.random()*16,r,cols[i%cols.length],grav));
    }
  }
  spark(x,y,n,c,dx=0){
    for(let i=0;i<n;i++){
      const a=-Math.PI/2+(Math.random()-0.5)*2;const s=3+Math.random()*6;
      const p=new Pt(x,y,Math.cos(a)*s+dx*1.2,Math.sin(a)*s-1,9+~~(Math.random()*10),1.5+Math.random()*2.5,c,0.3,0.88);
      this.list.push(p);
    }
  }
  ring(x,y,c){const p=new Pt(x,y,0,0,22,0,c,0,1);p.ring=true;p.rr=0;this.list.push(p)}
  trail(x,y,c,r=3){this.list.push(new Pt(x,y,(Math.random()-.5),(Math.random()-.5),14,r,c,-0.03,0.9))}
  tick(){this.list=this.list.filter(p=>p.tick())}
  draw(ctx){
    for(const p of this.list){
      ctx.save();ctx.globalAlpha=p.a*0.92;
      if(p.ring){
        ctx.strokeStyle=p.c;ctx.lineWidth=2.5;
        ctx.shadowBlur=10;ctx.shadowColor=p.c;
        ctx.globalAlpha=p.a*0.65;
        ctx.beginPath();ctx.arc(p.x,p.y,p.rr,0,Math.PI*2);ctx.stroke();
        p.rr+=(1-p.a)*55+1.5;
      } else {
        ctx.shadowBlur=7;ctx.shadowColor=p.c;
        ctx.fillStyle=p.c;
        ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
      }
      ctx.restore();
    }
  }
}

// ── Screen FX ────────────────────────────────────────────────
class SFX{
  constructor(){this.sk=0;this.sx=0;this.sy=0;this.fi=0;this.fc=null;this.fa=0;this.hs=0;this.sl=0}
  shake(i,d){this.sk=d;this._si=i}
  flash(c,a=0.5,d=8){this.fc=c;this.fa=a;this.fi=d;this._fd=d}
  hitStop(f=5){this.hs=Math.max(this.hs,f)}
  slow(d=80){this.sl=d}
  get frozen(){return this.hs>0}
  get slowing(){return this.sl>0}
  tick(){
    if(this.sk>0){this.sk--;this.sx=(Math.random()-.5)*this._si*2.2;this.sy=(Math.random()-.5)*this._si*1.5}
    else{this.sx=0;this.sy=0}
    if(this.fi>0){this.fi--;this.fa=0.55*(this.fi/this._fd)}
    if(this.hs>0)this.hs--;if(this.sl>0)this.sl--;
  }
  apply(ctx){ctx.translate(this.sx,this.sy)}
  drawFlash(ctx){
    if(this.fi>0&&this.fc){ctx.save();ctx.globalAlpha=this.fa;ctx.fillStyle=this.fc;ctx.fillRect(0,0,W,H);ctx.restore()}
  }
}

// ── Projectile ───────────────────────────────────────────────
class Proj{
  constructor(x,y,dir,oid,c){
    this.x=x;this.y=y;this.vx=dir*(c.spd||8);this.vy=c.vy||0;
    this.oid=oid;this.dmg=c.dmg||80;this.w=c.w||36;this.h=c.h||22;
    this.col=c.col||'#4af';this.glow=c.glow||'#9ef';this.type=c.type||'e';
    this.life=c.life||115;this.active=true;
  }
  get hb(){return{x:this.x-this.w/2,y:this.y-this.h/2,w:this.w,h:this.h}}
  tick(){this.x+=this.vx;this.y+=this.vy;this.life--;if(this.life<=0||this.x<-80||this.x>W+80)this.active=false}
  draw(ctx,pts,T){
    if(!this.active)return;
    ctx.save();ctx.shadowBlur=24;ctx.shadowColor=this.glow;
    if(this.type==='e'){
      const g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.w*.7);
      g.addColorStop(0,'#fff');g.addColorStop(0.3,this.glow);g.addColorStop(1,this.col+'00');
      ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(this.x,this.y,this.w*.7,this.h*.6,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(this.x,this.y,this.w*.22,0,Math.PI*2);ctx.fill();
    } else {
      for(let i=2;i>=0;i--){
        const ox=i*8*(this.vx>0?-1:1);
        ctx.globalAlpha=0.88-i*0.25;ctx.fillStyle=i===0?'#fff':this.col;
        ctx.beginPath();ctx.ellipse(this.x+ox,this.y+Math.sin(T*13+i)*2.5,this.w*.5-i*5,this.h*.42,0,0,Math.PI*2);ctx.fill();
      }
    }
    ctx.restore();
    if(Math.random()<0.4)pts.trail(this.x-this.vx*2.5,this.y,this.glow,3.5);
  }
}

// ── Color helpers ─────────────────────────────────────────
function _lt(hex,a){try{const n=parseInt(hex.replace('#',''),16);const r=Math.min(255,(n>>16)+a),g=Math.min(255,((n>>8)&255)+a),b=Math.min(255,(n&255)+a);return'#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('')}catch(e){return hex}}
function _dk(hex,a){return _lt(hex,-a)}

// ── Fighter ──────────────────────────────────────────────────
class Fighter{
  constructor(id,cn,sx,fr,isHuman){
    this.id=id;this.cn=cn;this.C=CHARS[cn];
    this.x=sx;this.y=FLOOR;this.vx=0;this.vy=0;this.fr=fr;
    this.w=48;this.h=118;
    this.hp=this.C.hp;this.mhp=this.C.hp;this.dhp=this.C.hp;
    this.en=0;this.men=100;
    this.st=S.IDLE;this.sT=0;
    this.hf=0;this.inv=0;
    this.cb=0;this.cbdmg=0;this.cbT=0;
    this.hmv=false;this.hcnt=0;this.lhT=0;
    this.projs=[];this.aimgs=[];
    this.isHuman=isHuman;
    if(isHuman){this.im=new Input();this.sb=new SpecialBuf(this.im)}
  }
  get grnd(){return this.y>=FLOOR}
  get air(){return !this.grnd}
  isAtk(){return[S.LP,S.MP,S.HP,S.CL,S.CM,S.CH,S.JA,S.SP1,S.SP2,S.SP3,S.SUP].includes(this.st)}
  isBlk(){return this.st===S.BH||this.st===S.BL}
  isKO(){return this.st===S.KO}
  isHurt(){return[S.HIT,S.KD,S.GU].includes(this.st)}
  get mv(){return this.C.moves[this.st]}
  get hbs(){
    const m=this.mv;if(!m||!m.hbs.length)return[];
    if(this.sT<m.su||this.sT>=m.su+m.ac)return[];
    if(this.hmv&&!m.p.multi)return[];
    if(this.hmv&&m.p.multi&&this.hcnt>=m.p.multi)return[];
    if(this.hmv&&this.sT-this.lhT<5)return[];
    const d=this.fr?1:-1;
    return m.hbs.map(h=>({x:this.x+d*h.ox-(this.fr?0:h.w),y:this.y-h.oy-h.h,w:h.w,h:h.h}));
  }
  get hurt(){
    if(this.inv>0||this.isKO())return null;
    const cr=[S.CR,S.BL,S.CL,S.CM,S.CH].includes(this.st);
    const h=cr?this.h*.62:this.h;
    return{x:this.x-this.w/2,y:this.y-h,w:this.w,h};
  }
  go(ns){
    if(this.st===ns)return;this.st=ns;this.sT=0;this.hmv=false;this.hcnt=0;
    if(ns===S.SP2){this.vy=-17;if(this.grnd)this.y=FLOOR-1;if(this.mv?.p.inv)this.inv=this.mv.p.inv}
    if(ns===S.SP1&&this.cn==='KIRA'){this.vx=this.fr?14:-14}
    if(ns===S.SP3&&this.cn==='RYOKEN'){this.vx=this.fr?9:-9}
    if(ns===S.SUP){this.en=0}
  }
  recHit(m,aFR,pts){
    if(this.inv>0||this.isKO())return false;
    const blk=this._blk(m,aFR);
    this.hf=8;const kd=aFR?1:-1;
    if(blk){this.hp=Math.max(0,this.hp-Math.floor(m.dmg*.08));this.en=Math.min(this.men,this.en+4);this.vx=kd*m.kx*.4;this.sT=0;return true}
    this.hp=Math.max(0,this.hp-m.dmg);
    this.en=Math.min(this.men,this.en+m.dmg*.14);
    if(m.p.kd||m.p.sup||this.hp<=0){
      this.go(this.hp<=0?S.KO:S.KD);this.vx=kd*m.kx*1.3;this.vy=-6;
    } else {this.go(S.HIT);this.vx=kd*m.kx;this.vy=m.ky<0?m.ky:0}
    const hx=this.x,hy=this.y-this.h*.55;
    pts.spark(hx,hy,15,this.C.col,kd);pts.burst(hx,hy,9,['#fff','#ff8',this.C.glow],5.5,[2,6]);pts.ring(hx,hy,this.C.glow);
    return true;
  }
  _blk(m,aFR){
    if(!this.isBlk()||this.air||this.fr===aFR)return false;
    if(m.p.low&&this.st!==S.BL)return false;
    if(m.p.ovhd&&this.st===S.BL)return false;
    return true;
  }

  // ── Human input — Clavier AZERTY ou Manette DualSense ──
  handleInput(opp){
    if(!this.isHuman)return;
    const im=this.im,sb=this.sb;
    im.flush();sb.tick();
    if(this.isKO()||this.isHurt())return;
    if(this.isAtk()){const m=this.mv;if(m&&this.sT<m.su+m.ac+m.re)return;if(this.grnd)this.go(S.IDLE);return}
    // Directions — clavier OU manette
    const T=typeof _touch!=='undefined'?_touch:{};
    const dn =im.hk(KB.down) ||im.hk(GP.down) ||!!T.down;
    const up_ =im.hk(KB.up)  ||im.hk(GP.up)   ||!!T.up;
    const lft =im.hk(KB.left) ||im.hk(GP.left) ||!!T.left;
    const rgt =im.hk(KB.right)||im.hk(GP.right)||!!T.right;
    // Boutons attaque
    const atkP=im.pk(KB.atk) ||im.pk(GP.atk)||!!T.atk;
    const supP=im.pk(GP.sup)||!!T.sup;
    const sp2P=im.pk(GP.sp2)||!!T.sp2;
    const sp3P=im.pk(GP.sp3)||!!T.sp3;
    const jupP=im.pk(GP.jump)||!!T.jmp;
    const fwd=this.fr?rgt:lft,bck=this.fr?lft:rgt;

    // SUPER direct (R1 manette ou Z+S+R clavier)
    if((supP||(atkP&&sb.hasAll(['KeyZ','KeyS','KeyR'],12)))&&this.en>=this.C.eCost){
      sb.clear();this.go(S.SUP);return;
    }
    // Uppercut direct (Rond manette ou Z+R clavier)
    if(sp2P||(atkP&&sb.hasAll(['KeyZ','KeyR'],10))){
      sb.clear();this.go(S.SP2);return;
    }
    // Special bas (Triangle manette ou S+R clavier)
    if(sp3P||(atkP&&dn)){sb.clear();this._sp3();return}
    // Attaque saut
    if(atkP&&this.air){this.go(S.JA);return}
    // Attaque sol
    if(atkP&&this.grnd){this.go(S.HP);return}
    // Garde : tenir direction arriere
    if(this.grnd&&bck){this.go(dn?S.BL:S.BH);return}
    // Mouvements
    if(this.grnd){
      const jmp=up_||jupP;
      if(jmp){this._jump(fwd,bck);return}
      if(dn){this.go(S.CR);return}
      if(fwd){this.go(S.WF);return}
      if(bck){this.go(S.WB);return}
      this.go(S.IDLE);
    }
  }
  _sp1(){
    if(this.cn==='RYOKEN'){
      this.go(S.SP1);const d=this.fr?1:-1;
      this.projs.push(new Proj(this.x+d*44,this.y-74,d,this.id,{spd:9,dmg:85,w:36,h:24,col:'#2ee8ff',glow:'#9ef',type:'e',life:110}));
    } else {this.go(S.SP1)}
  }
  _sp3(){
    this.go(S.SP3);const d=this.fr?1:-1;
    if(this.cn==='KIRA') this.projs.push(new Proj(this.x+d*30,this.y-64,d,this.id,{spd:5.5,dmg:70,w:52,h:52,col:'#ff5522',glow:'#fa8',type:'f',life:90}));
    else if(this.cn==='RYOKEN'){this.vx=d*9}
    else if(this.cn==='ZERO'){for(let i=0;i<3;i++)this.projs.push(new Proj(this.x+d*30,this.y-60-i*12,d,this.id,{spd:9+i*2,dmg:42,w:24,h:24,col:'#88ddff',glow:'#ccffff',type:'i',life:70}))}
    else if(this.cn==='VEGA'){this.projs.push(new Proj(this.x+d*30,this.y-30,d,this.id,{spd:6,dmg:90,w:70,h:40,col:'#ffcc00',glow:'#ffee88',type:'e',life:95}))}
  }
  _jump(fwd,bck){
    this.vy=JV;this.y=FLOOR-1;
    if(fwd){this.go(S.JF);this.vx=this.fr?WF:-WF}
    else if(bck){this.go(S.JB);this.vx=this.fr?-WB:WB}
    else{this.go(S.JU);this.vx=0}
  }

  // ── Tick ──
  tick(opp,pts){this._opp=opp;
    this.sT++;
    if(this.hf>0)this.hf--;if(this.inv>0)this.inv--;
    if(this.cbT>0)this.cbT--;else if(this.cb>0){this.cb=0;this.cbdmg=0}
    if(this.dhp>this.hp)this.dhp=Math.max(this.hp,this.dhp-2.8);
    if([S.SP1,S.SUP].includes(this.st)&&this.sT%2===0)this.aimgs.push({x:this.x,y:this.y,fr:this.fr,a:.42});
    this.aimgs=this.aimgs.filter(a=>{a.a-=0.065;return a.a>0});
    this.projs=this.projs.filter(p=>{p.tick();return p.active});
    this._stLogic(opp,pts);this._phys();
    if([S.IDLE,S.WF,S.WB,S.CR,S.BH,S.BL].includes(this.st))this.fr=this.x<opp.x;
    this.x=Math.max(SL+this.w/2,Math.min(SR-this.w/2,this.x));
  }
  _stLogic(opp,pts){
    const m=this.mv;
    switch(this.st){
      case S.WF:{const tv=this.fr?WF:-WF;this.vx+=(tv-this.vx)*0.5;}break;
      case S.WB:{const tv=this.fr?-WB:WB;this.vx+=(tv-this.vx)*0.45;}break;
      case S.IDLE:this.vx*=0.82;break;
      case S.CR:this.vx*=0.78;break;
      case S.BH:case S.BL:this.vx*=0.5;
        if(this.isHuman){const b=this.fr?this.im.hk(KB.left):this.im.hk(KB.right);if(!b)this.go(S.IDLE)}
        break;
      case S.HIT:this.vx*=0.78;if(this.sT>20&&this.grnd)this.go(S.IDLE);break;
      case S.KD:if(this.grnd){this.vx*=0.55;if(this.sT>58&&this.hp>0){this.go(S.GU);this.inv=24}}break;
      case S.GU:this.vx*=0.5;if(this.sT>28)this.go(S.IDLE);break;
      case S.SP1:
        if(this.cn==='KIRA'&&this.sT<=18)this.vx=this.fr?14:-14;else this.vx*=0.7;
        if(m&&this.sT>=m.su+m.ac+m.re&&this.grnd)this.go(S.IDLE);break;
      case S.SP2:
        // ZERO teleport: at frame 6, jump behind opponent
        if(this.cn==='ZERO'&&this.sT===6&&this._opp){
          const d=this.fr?1:-1;
          this.x=this._opp.x-d*80;
          this.inv=20;
        }
        if(m&&this.sT>=m.su+m.ac+m.re&&this.grnd)this.go(S.IDLE);break;
      case S.SP3:
        if(this.cn==='RYOKEN'&&this.sT<12)this.vx=this.fr?9:-9;else if(this.sT>12)this.vx*=0.65;
        if(m&&this.sT>=m.su+m.ac+m.re&&this.grnd)this.go(S.IDLE);break;
      case S.SUP:this.vx*=0.85;if(m&&this.sT>=m.su+m.ac+m.re&&this.grnd)this.go(S.IDLE);break;
      default:this.vx*=0.7;if(m&&this.sT>=m.su+m.ac+m.re&&this.grnd)this.go(S.IDLE);break;
    }
  }
  _phys(){
    if(this.vy>0)this.vy+=G*1.5;else this.vy+=G;
    this.x+=this.vx;this.y+=this.vy;
    if(this.y>=FLOOR){
      this.y=FLOOR;this.vy=0;
      if([S.JU,S.JF,S.JB,S.JA].includes(this.st)){this.go(S.IDLE);this.vx*=0.35}
      if(this.st===S.SP2)this.go(S.IDLE);
      if(this.st===S.KD)this.vx*=0.4;
    }
  }

  // ─── DRAWING ─────────────────────────────────────────────
  draw(ctx,pts,T){
    for(const ai of this.aimgs){
      ctx.save();ctx.globalAlpha=ai.a*.4;
      this._drawChar(ctx,ai.x,ai.y,ai.fr,T,true);ctx.restore();
    }
    ctx.save();
    if(this.hf>0&&this.hf%2===0)ctx.filter='brightness(8) saturate(0)';
    else if(this.inv>0&&this.inv%3===0)ctx.globalAlpha=0.4;
    this._drawChar(ctx,this.x,this.y,this.fr,T,false);
    ctx.restore();
    for(const p of this.projs)p.draw(ctx,pts,T);
  }

  _drawChar(ctx,x,y,fr,T,ghost){
    const C=this.C,d=fr?1:-1,st=this.st,t=this.sT;
    // Pose derived params
    let lean=0,squat=0,armAng=0,legAng=0,stretch=0,jf=0,headTilt=0,jumpFloat=0;
    const ib=Math.sin(T*2)*2.5;
    // Smooth interpolation helper
    const lerp=(a,b,t)=>a+(b-a)*Math.min(1,t);
    // State frame progress 0->1
    const fp=Math.min(1, t/8);
    const fp2=Math.min(1, t/14);

    switch(st){
      case S.IDLE:
        // Natural breathing: whole body sways gently
        lean=Math.sin(T*1.1)*1.5;
        stretch=Math.sin(T*1.1)*.8;
        headTilt=Math.sin(T*.7)*.6;
        break;

      case S.WF:
        // Weight shift: body leans into walk, arms oppose legs
        lean=d*6+Math.sin(T*6.5)*1.8;
        legAng=Math.sin(T*6.5)*22;
        armAng=Math.sin(T*6.5+Math.PI)*20;
        headTilt=Math.sin(T*6.5)*.8;
        break;

      case S.WB:
        lean=-d*5+Math.sin(T*5.5)*1.4;
        legAng=Math.sin(T*5.5)*17;
        armAng=Math.sin(T*5.5+Math.PI)*15;
        break;

      case S.CR: squat=26;lean=d*3;armAng=-12;break;
      case S.BH: lean=-d*9;armAng=-26;headTilt=-3;break;
      case S.BL: squat=26;lean=-d*5;armAng=-20;break;

      case S.JU:
        // Anticipation: crouch on frame 1-3, then explosion up
        if(t<3){squat=8;stretch=-3}
        else{stretch=lerp(-4,-12,fp);legAng=lerp(0,-22,fp);armAng=lerp(0,-38,fp);jumpFloat=lerp(0,-8,fp)}
        lean=d*4;break;
      case S.JF:
        stretch=lerp(-2,-10,fp);legAng=lerp(0,-18,fp);
        armAng=lerp(0,-32,fp);jumpFloat=lerp(0,-6,fp);lean=d*8;break;
      case S.JB:
        stretch=lerp(-2,-8,fp);armAng=lerp(0,-28,fp);
        jumpFloat=lerp(0,-5,fp);lean=-d*6;break;
      case S.JA:
        stretch=-5;armAng=lerp(0,d*78,fp);
        legAng=lerp(0,16,fp);jumpFloat=-4;break;

      case S.LP:{
        // Light: snap out, then retract
        const ext=t<4?lerp(0,1,t/4):lerp(1,0,(t-4)/6);
        lean=d*lerp(0,20,ext);armAng=d*lerp(0,76,ext);
        headTilt=d*lerp(0,3,ext);break;}

      case S.MP:{
        const ext=t<6?lerp(0,1,t/6):lerp(1,0,(t-6)/8);
        lean=d*lerp(0,32,ext);armAng=d*lerp(0,108,ext);
        headTilt=d*lerp(0,5,ext);break;}

      case S.HP:{
        // Heavy: big wind-up then slam
        const ext=t<4?0:t<11?lerp(0,1,(t-4)/7):lerp(1,.15,(t-11)/10);
        const windup=t<4?lerp(0,-1,t/4):0;
        lean=d*lerp(-8,44,ext)+d*windup*12;
        armAng=d*lerp(-15,136,ext);
        headTilt=d*lerp(-4,8,ext);
        squat=t<4?lerp(0,6,t/4)*2:0;break;}

      case S.CL: squat=26;lean=d*(t<4?lerp(0,16,t/4):lerp(16,4,(t-4)/6));armAng=d*(t<4?lerp(0,60,t/4):lerp(60,8,(t-4)/6));break;
      case S.CM: squat=26;lean=d*(t<6?lerp(0,22,t/6):lerp(22,6,(t-6)/8));armAng=d*(t<6?lerp(0,88,t/6):lerp(88,10,(t-6)/8));break;
      case S.CH: squat=26;lean=d*(t<10?lerp(0,28,t/10):lerp(28,8,(t-10)/12));armAng=d*(t<10?lerp(0,100,t/10):lerp(100,12,(t-10)/12));break;

      case S.SP1:
        if(this.cn==='KIRA'){
          lean=lerp(0,d*30,fp2);armAng=lerp(0,d*44,fp2);
        } else {
          lean=d*10;armAng=d*lerp(-10,62,fp);}
        break;

      case S.SP2:
        // Uppercut: crouch then explode UP
        if(t<5){squat=lerp(0,22,t/5);stretch=lerp(0,-6,t/5);armAng=d*lerp(0,-38,t/5)}
        else{squat=0;stretch=lerp(-6,-16,(t-5)/8);armAng=d*lerp(-38,20,(t-5)/8);lean=d*5}
        break;

      case S.SP3:
        squat=16;lean=lerp(0,d*32,fp);
        legAng=lerp(0,d*55,fp);break;

      case S.SUP:{
        const pulse=Math.sin(T*14)*0.5+0.5;
        lean=d*(Math.sin(T*16)*5);
        armAng=lerp(0,100,fp2)+Math.sin(T*12)*24;
        stretch=-4+pulse*2;
        headTilt=Math.sin(T*8)*3;
        break;}

      case S.HIT:
        lean=-d*lerp(0,34,Math.min(1,t/4));
        headTilt=-d*5;
        break;

      case S.KD:
        lean=lerp(-d*34,-d*105,Math.min(1,t/10));
        squat=lerp(0,40,Math.min(1,t/10));
        break;

      case S.KO:
        lean=-d*105;squat=40;break;

      case S.GU:
        lean=lerp(-d*40,0,Math.min(1,t/20));
        squat=lerp(22,0,Math.min(1,t/20));
        break;
    }
    const base=y-4+ib+jumpFloat;
    const TH=52-squat*.4; // torso height
    const cr=[S.CR,S.BL,S.CL,S.CM,S.CH].includes(st);

    ctx.save();
    ctx.translate(x,base);
    if(!ghost&&this.st===S.SUP){ctx.shadowBlur=30;ctx.shadowColor=C.glow}
    else if(!ghost&&this.isAtk()&&this.mv){
      const mv=this.mv;
      if(this.sT>=mv.su&&this.sT<mv.su+mv.ac){
        // Attack direction arrow
        const ax=x-this.x+d*68,ay=-(this.h*.52);
        ctx.save();ctx.globalAlpha=.75;
        ctx.strokeStyle=C.glow;ctx.lineWidth=3;ctx.shadowBlur=10;ctx.shadowColor=C.glow;
        ctx.beginPath();ctx.moveTo(ax-d*16,ay);ctx.lineTo(ax+d*16,ay);
        ctx.moveTo(ax+d*8,ay-7);ctx.lineTo(ax+d*16,ay);ctx.lineTo(ax+d*8,ay+7);
        ctx.stroke();ctx.restore();
      }
    }

    // ── Ground shadow ──
    if(!ghost){
      const sh=Math.max(0,(FLOOR-y)/180);
      ctx.save();ctx.globalAlpha=(0.35-sh*.3);
      ctx.fillStyle='rgba(0,0,0,0.5)';
      ctx.beginPath();ctx.ellipse(0,FLOOR-base,this.w*1.3,5,0,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }

    // ── Legs ──
    const lA=(legAng+(cr?15:0))*Math.PI/180;
    for(let i=0;i<2;i++){
      const s=i===0?1:-1;const ox=s*d*8;
      ctx.save();ctx.translate(ox+lean*.15,0);
      ctx.rotate(s===1?lA:-lA*.6);
      // Thigh
      ctx.fillStyle=C.col2;
      ctx.beginPath();rr(ctx,-7,0,14,cr?22:30,4);ctx.fill();
      // Shin
      ctx.save();ctx.translate(0,cr?22:30);ctx.rotate(s===1?lA*.4:-lA*.3);
      ctx.fillStyle=C.col2;
      ctx.beginPath();rr(ctx,-6,0,12,cr?14:26,3);ctx.fill();
      // Boot
      ctx.save();ctx.translate(0,cr?14:26);
      ctx.fillStyle=C.col;
      ctx.beginPath();rr(ctx,-8,-2,16,10,3);ctx.fill();
      // Boot toe
      ctx.fillStyle=C.trim;ctx.beginPath();rr(ctx,-8,6,16,4,2);ctx.fill();
      ctx.restore();ctx.restore();ctx.restore();
    }

    // ── Torso ──
    ctx.save();ctx.rotate(lean*Math.PI/180*.3);
    // Body
    const tg=ctx.createLinearGradient(-20,-TH-squat*.2,20,-TH-squat*.2+TH);
    tg.addColorStop(0,_dk(C.col,18));tg.addColorStop(.4,_lt(C.col,14));tg.addColorStop(1,C.col2);
    ctx.fillStyle=tg;
    ctx.shadowBlur=ghost?0:8;ctx.shadowColor=C.glow;
    ctx.beginPath();rr(ctx,-18,-TH-squat*.25,36,TH,8);ctx.fill();ctx.shadowBlur=0;
    // Chest detail
    if(!ghost&&!cr){
      ctx.fillStyle=C.glow+'55';ctx.beginPath();rr(ctx,-10,-TH-squat*.25+6,20,14,4);ctx.fill();
      ctx.strokeStyle=C.glow;ctx.lineWidth=1;ctx.globalAlpha=0.4;
      ctx.beginPath();ctx.moveTo(-6,-TH+8);ctx.lineTo(-6,-12);ctx.stroke();
      ctx.beginPath();ctx.moveTo(4,-TH+8);ctx.lineTo(4,-12);ctx.stroke();
      ctx.globalAlpha=1;
    }
    // Belt + buckle
    ctx.fillStyle=_dk(C.col,22);ctx.shadowBlur=0;ctx.beginPath();rr(ctx,-18,-12,36,9,2);ctx.fill();
    ctx.fillStyle=C.trim;ctx.beginPath();rr(ctx,-4,-11,8,7,2);ctx.fill();
    ctx.restore();

    // ── Back arm ──
    ctx.save();ctx.rotate(lean*Math.PI/180*.3);
    ctx.translate(-d*14,-TH+10-squat*.15);
    ctx.rotate(-armAng*Math.PI/180*.18);
    ctx.fillStyle=C.col2;
    ctx.beginPath();rr(ctx,-5,0,10,28,4);ctx.fill();
    // Forearm
    ctx.save();ctx.translate(0,18);ctx.rotate(-armAng*Math.PI/180*.08);
    ctx.fillStyle=C.col2+'cc';ctx.beginPath();rr(ctx,-4,0,8,16,3);ctx.fill();
    ctx.restore();ctx.restore();

    // ── Front arm ──
    ctx.save();ctx.rotate(lean*Math.PI/180*.3);
    ctx.translate(d*14,-TH+10-squat*.15);
    ctx.rotate(armAng*Math.PI/180*.36);
    ctx.fillStyle=C.col;ctx.shadowBlur=ghost?0:8;ctx.shadowColor=C.glow;
    ctx.beginPath();rr(ctx,-5,0,10,30,4);ctx.fill();
    // Forearm + glove
    ctx.save();ctx.translate(0,20);ctx.rotate(armAng*Math.PI/180*.14);
    ctx.fillStyle=C.col;ctx.beginPath();rr(ctx,-5,0,10,16,3);ctx.fill();
    // Fist/glove
    if(Math.abs(armAng)>30&&!ghost){
      ctx.fillStyle=C.trim;ctx.shadowBlur=16;ctx.shadowColor=C.glow;
      ctx.beginPath();rr(ctx,-7,14,14,12,3);ctx.fill();
      ctx.fillStyle='#fff';ctx.shadowBlur=0;ctx.globalAlpha=0.6;
      ctx.beginPath();rr(ctx,-5,16,10,4,2);ctx.fill();ctx.globalAlpha=1;
    }
    ctx.restore();ctx.restore();

    // ── Head ──
    const hY=-TH-squat*.25-30+stretch*.35;
    ctx.save();ctx.translate(d*3,hY);ctx.rotate(lean*Math.PI/180*.15);
    ctx.shadowBlur=ghost?0:16;ctx.shadowColor=C.glow;
    // Neck
    ctx.fillStyle='#c08860';ctx.beginPath();rr(ctx,-5,2,10,8,2);ctx.fill();
    // Draw character-specific head
    if(this.cn==='RYOKEN')      this._headRyoken(ctx,C,ghost,T);
    else if(this.cn==='KIRA')  this._headKira(ctx,C,ghost,T);
    else if(this.cn==='ZERO')  this._headZ(ctx,C,ghost,T,d);
    else                       this._headV(ctx,C,ghost,T,d);
    ctx.restore();

    ctx.restore(); // main
  }

  _headRyoken(ctx,C,ghost,T){
    // Skull/face
    ctx.fillStyle='#d0956a';ctx.beginPath();ctx.ellipse(0,0,13,15,0,0,Math.PI*2);ctx.fill();
    // Hair (spiky, swept back)
    ctx.fillStyle='#1a1a3a';
    ctx.beginPath();ctx.moveTo(-12,3);ctx.quadraticCurveTo(-14,-20,0,-26);ctx.quadraticCurveTo(10,-30,14,-10);
    ctx.quadraticCurveTo(14,2,13,5);ctx.closePath();ctx.fill();
    // Hair highlights
    ctx.strokeStyle='#4444aa';ctx.lineWidth=1.5;ctx.globalAlpha=0.7;
    ctx.beginPath();ctx.moveTo(-3,-26);ctx.quadraticCurveTo(-8,-18,-9,2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(5,-28);ctx.quadraticCurveTo(8,-18,9,-4);ctx.stroke();
    ctx.globalAlpha=1;
    // Eyes
    if(!ghost){
      ctx.fillStyle=C.col;ctx.shadowBlur=12;ctx.shadowColor=C.col;
      ctx.beginPath();ctx.ellipse(4*1,-3,5,4,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';ctx.shadowBlur=0;ctx.beginPath();ctx.arc(5.5,-3.5,1.8,0,Math.PI*2);ctx.fill();
    }
    // White scarf
    ctx.fillStyle='rgba(230,240,255,0.85)';
    ctx.beginPath();ctx.moveTo(-12,13);ctx.quadraticCurveTo(0,18,12,13);ctx.quadraticCurveTo(10,22,0,23);ctx.quadraticCurveTo(-10,22,-12,13);ctx.fill();
    // Earring
    ctx.fillStyle=C.glow;ctx.shadowBlur=6;ctx.shadowColor=C.glow;
    ctx.beginPath();ctx.arc(-13,3,2.5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  }

  _headKira(ctx,C,ghost,T){
    // Skull/face
    ctx.fillStyle='#cc8855';ctx.beginPath();ctx.ellipse(0,0,13,15,0,0,Math.PI*2);ctx.fill();
    // Spikey flame hair
    ctx.fillStyle='#cc2200';
    ctx.beginPath();
    ctx.moveTo(-12,5);ctx.quadraticCurveTo(-15,-10,-8,-22);
    ctx.quadraticCurveTo(-4,-30,0,-26);ctx.quadraticCurveTo(4,-32,8,-24);
    ctx.quadraticCurveTo(13,-14,12,-6);ctx.quadraticCurveTo(14,2,13,6);ctx.closePath();ctx.fill();
    // Hair highlight
    ctx.fillStyle='#ff6622';ctx.globalAlpha=0.7;
    ctx.beginPath();ctx.moveTo(-4,-26);ctx.quadraticCurveTo(-2,-16,0,-8);ctx.quadraticCurveTo(2,-16,5,-24);ctx.closePath();ctx.fill();
    ctx.globalAlpha=1;
    // Eyes
    if(!ghost){
      ctx.fillStyle=C.col;ctx.shadowBlur=12;ctx.shadowColor=C.col;
      ctx.beginPath();ctx.ellipse(4,-3,5,4,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';ctx.shadowBlur=0;ctx.beginPath();ctx.arc(5.5,-3.5,1.8,0,Math.PI*2);ctx.fill();
    }
    // Headband
    ctx.fillStyle=C.trim;ctx.beginPath();rr(ctx,-12,-8,24,6,2);ctx.fill();
    ctx.fillStyle=C.col;ctx.beginPath();ctx.arc(0,-5,3,0,Math.PI*2);ctx.fill();
    // Jaw mark (scar)
    ctx.strokeStyle='rgba(255,60,0,0.6)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(6,2);ctx.lineTo(10,10);ctx.stroke();
  }
}

// ── Rect helper ──────────────────────────────────────────────
function rr(ctx,x,y,w,h,r){
  if(ctx.roundRect){ctx.roundRect(x,y,w,h,r);return}
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);
}

// ── AI ───────────────────────────────────────────────────────
class AI{
  constructor(f){this.f=f;f.isHuman=false;this.t=0;this.bt=0}
  tick(opp,pts){
    const f=this.f;if(f.isKO()||f.isHurt())return;if(f.isAtk())return;
    if(this.bt>0){this.bt--;return}
    if(--this.t>0)return;
    this.t=10+~~(Math.random()*14);
    const dist=Math.abs(f.x-opp.x),er=f.en/f.men;
    if(er>=1&&dist<190&&Math.random()<.7){f.go(S.SUP);return}
    if(opp.air&&dist<140&&Math.random()<.78){this._sp(S.SP2,pts);return}
    if(dist>220&&f.cn==='RYOKEN'&&Math.random()<.5){this._sp(S.SP1,pts);return}
    if(dist>210&&f.cn==='KIRA'&&Math.random()<.42){this._sp(S.SP1,pts);return}
    if(dist<90){
      const r=Math.random();
      if(r<.14){f.go(S.BH);this.bt=16;return}
      if(r<.28){f.go(S.LP);return}
      if(r<.44){f.go(S.MP);return}
      if(r<.58){f.go(S.HP);return}
      if(r<.68){f.go(S.CL);return}
      if(r<.78){this._sp(S.SP1,pts);return}
      if(r<.90){this._sp(S.SP3,pts);return}
      f.go(S.BH);this.bt=10;
    } else {
      this._move(opp);
    }
  }
  _move(opp){
    const f=this.f;
    f.go(f.x<opp.x?(f.fr?S.WF:S.WB):(f.fr?S.WB:S.WF));this.t=16;
  }
  _sp(which,pts){
    const f=this.f;f.go(which);
    if(which===S.SP1&&f.cn==='RYOKEN'){
      const d=f.fr?1:-1;
      f.projs.push(new Proj(f.x+d*44,f.y-74,d,f.id,{spd:9,dmg:85,w:36,h:24,col:'#2ee8ff',glow:'#9ef',type:'e',life:110}));
    }
    if(which===S.SP3&&f.cn==='KIRA'){
      const d=f.fr?1:-1;
      f.projs.push(new Proj(f.x+d*30,f.y-64,d,f.id,{spd:5.5,dmg:70,w:52,h:52,col:'#ff5522',glow:'#fa8',type:'f',life:90}));
    }
  }
}

// ── Collision ─────────────────────────────────────────────────
function ov(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function hitCheck(atk,def,pts,sfx){
  if(atk.isKO()||def.isKO())return;
  const hurt=def.hurt;if(!hurt)return;
  for(const hb of atk.hbs){
    if(ov(hb,hurt)){
      const m=atk.mv;if(!m)continue;
      if(def.recHit(m,atk.fr,pts)){
        atk.hmv=true;atk.hcnt++;atk.lhT=atk.sT;
        atk.en=Math.min(atk.men,atk.en+m.dmg*.07);
        def.cb++;def.cbdmg+=m.dmg;def.cbT=95;
        const big=m.p.sup,med=m.dmg>=150;
        if(big){sfx.shake(13,22);sfx.flash('#fff',.55,14);sfx.hitStop(10);sfx.slow(90)}
        else if(med){sfx.shake(6,11);sfx.hitStop(5)}
        else{sfx.shake(3,5);sfx.hitStop(3)}
      }
    }
  }
  for(const p of atk.projs){
    if(!p.active)continue;
    if(ov(p.hb,hurt)){
      const fm={dmg:p.dmg,kx:7*(p.vx>0?1:-1),ky:-3,p:{}};
      if(def.recHit(fm,p.vx>0,pts)){
        p.active=false;atk.en=Math.min(atk.men,atk.en+p.dmg*.07);
        def.cb++;def.cbdmg+=p.dmg;def.cbT=95;
        sfx.shake(5,8);sfx.hitStop(4);
        pts.burst(p.x,p.y,24,['#fff',p.glow,p.col],7,[3,9]);pts.ring(p.x,p.y,p.glow);
      }
    }
  }
}

// ── Stage ─────────────────────────────────────────────────────
class Stage{
  constructor(){this.T=0;this._genStars();this._genBuildings()}
  _genStars(){
    this.stars=[];
    for(let i=0;i<90;i++) this.stars.push({x:(i*137.5+50)%W,y:(i*73.1+20)%(H*.5),r:.3+Math.random()*.9,p:Math.random()*Math.PI*2,sp:.8+Math.random()*1.4});
  }
  _genBuildings(){
    this.blds=[];
    for(let i=0;i<22;i++){
      const x=(i*53+30)%(W+100)-50,w=30+(i*41)%55,h=55+(i*59)%180;
      const c=['#0e0028','#140038','#0a0020','#180048'][i%4];
      const wins=[];
      for(let wx=0;wx<Math.floor(w/11);wx++)
        for(let wy=0;wy<Math.floor(h/18);wy++)
          if((i+wx+wy)%3!==0)wins.push({wx,wy,col:['#3cf','#f46','#4f8','#aa4'][((i+wx)%4)]});
      this.blds.push({x,w,h,c,wins,neon:i%3===0,nc:i%2===0?'#f46':'#3bf'});
    }
  }
  tick(){this.T+=1/60}
  draw(ctx){
    const T=this.T;
    // Sky gradient
    const sk=ctx.createLinearGradient(0,0,0,H);
    sk.addColorStop(0,'#010008');sk.addColorStop(0.5,'#040018');sk.addColorStop(1,'#0c0028');
    ctx.fillStyle=sk;ctx.fillRect(0,0,W,H);
    // Stars
    for(const s of this.stars){
      const a=.15+Math.sin(T*s.sp+s.p)*.18;
      ctx.globalAlpha=a;ctx.fillStyle='#ddeeff';
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
    // Moon
    const mg=ctx.createRadialGradient(W*.78,45,0,W*.78,45,40);
    mg.addColorStop(0,'rgba(200,180,255,0.28)');mg.addColorStop(1,'rgba(160,120,255,0)');
    ctx.fillStyle=mg;ctx.beginPath();ctx.arc(W*.78,45,40,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(180,140,255,0.5)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(W*.78,45,25,0,Math.PI*2);ctx.stroke();
    // Far mountain range
    ctx.fillStyle='#0c0022';
    ctx.beginPath();ctx.moveTo(0,H*.72);
    for(let x=0;x<=W;x+=16){
      const my=H*.62-Math.sin(x/W*11+0.5)*42-Math.sin(x/W*4.5+1)*60;
      ctx.lineTo(x,my);
    }
    ctx.lineTo(W,H*.72);ctx.closePath();ctx.fill();
    // Buildings
    for(const b of this.blds){
      const by=FLOOR-b.h+8;
      ctx.fillStyle=b.c;ctx.fillRect(b.x,by,b.w,b.h+FLOOR-by+10);
      // Windows
      for(const w of b.wins){
        const alpha=.15+Math.sin(T*(1.2+w.wx*.05+w.wy*.03)+w.wx+w.wy*.6)*.18;
        ctx.globalAlpha=alpha;ctx.fillStyle=w.col;
        ctx.fillRect(b.x+w.wx*10+3,by+w.wy*17+4,6,9);
      }
      ctx.globalAlpha=1;
      // Neon sign
      if(b.neon){
        ctx.strokeStyle=b.nc;ctx.lineWidth=2;
        const fl=.45+Math.sin(T*3.5+b.x*.01)*.35;
        ctx.globalAlpha=fl;ctx.shadowBlur=10;ctx.shadowColor=b.nc;
        ctx.strokeRect(b.x+4,by+10,b.w-8,12);ctx.shadowBlur=0;ctx.globalAlpha=1;
        // Inner bar
        ctx.fillStyle=b.nc+'44';ctx.fillRect(b.x+6,by+12,b.w-12,8);
      }
      // Antenna
      if(b.h>120){
        ctx.strokeStyle='#3a2060';ctx.lineWidth=1.5;
        ctx.beginPath();ctx.moveTo(b.x+b.w/2,by);ctx.lineTo(b.x+b.w/2,by-18);ctx.stroke();
        const bc=(this.T*2+b.x)%3<1.5?'#ff2':'#200';
        ctx.fillStyle=bc;ctx.beginPath();ctx.arc(b.x+b.w/2,by-20,2.5,0,Math.PI*2);ctx.fill();
      }
    }
    // Floor
    const fg=ctx.createLinearGradient(0,FLOOR,0,H);
    fg.addColorStop(0,'#1a0050');fg.addColorStop(.5,'#0a0028');fg.addColorStop(1,'#050010');
    ctx.fillStyle=fg;ctx.fillRect(0,FLOOR,W,H-FLOOR);
    // Floor glow edge
    ctx.strokeStyle='#8040ff';ctx.lineWidth=3;ctx.shadowBlur=22;ctx.shadowColor='#8040ff';ctx.globalAlpha=.8;
    ctx.beginPath();ctx.moveTo(0,FLOOR);ctx.lineTo(W,FLOOR);ctx.stroke();
    ctx.shadowBlur=0;ctx.globalAlpha=1;
    // Floor grid
    for(let gy=FLOOR+20;gy<H;gy+=24){
      ctx.strokeStyle='#4020a0';ctx.lineWidth=.8;
      ctx.globalAlpha=.1+.22*(gy-FLOOR)/(H-FLOOR);
      ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke();
    }
    for(let i=0;i<=16;i++){
      ctx.globalAlpha=.1;ctx.strokeStyle='#4020a0';ctx.lineWidth=.8;
      ctx.beginPath();ctx.moveTo(W/2+(i/16-.5)*W*.28,FLOOR);ctx.lineTo(i/16*W,H);ctx.stroke();
    }
    ctx.globalAlpha=1;
    // Floor reflection
    const rf=ctx.createLinearGradient(0,FLOOR,0,FLOOR+40);
    rf.addColorStop(0,'rgba(128,64,255,.12)');rf.addColorStop(1,'rgba(128,64,255,0)');
    ctx.fillStyle=rf;ctx.fillRect(0,FLOOR,W,40);
  }
}

// ── UI ────────────────────────────────────────────────────────
class UI{
  hBar(ctx,f,x,y,bw,flip,T){
    const r=f.hp/f.mhp,dr=f.dhp/f.mhp,bx=flip?x-bw:x;
    // Frame
    ctx.fillStyle='#100020';ctx.strokeStyle='#6040c0';ctx.lineWidth=2;
    ctx.beginPath();rr(ctx,bx-2,y-2,bw+4,24,5);ctx.fill();ctx.stroke();
    // Edge glow
    ctx.strokeStyle='rgba(160,80,255,.3)';ctx.lineWidth=1;
    ctx.beginPath();rr(ctx,bx-3,y-3,bw+6,26,6);ctx.stroke();
    // Lagging HP
    if(dr>r){const lw=bw*dr,lx=flip?bx+bw-lw:bx;ctx.fillStyle='#c09010';ctx.beginPath();rr(ctx,lx,y,lw,20,3);ctx.fill()}
    // HP bar
    const col=r>.5?'#00ff80':r>.25?'#ffcc00':'#ff2040';
    const hw=bw*r,hx=flip?bx+bw-hw:bx;
    ctx.shadowBlur=10;ctx.shadowColor=col;ctx.fillStyle=col;
    ctx.beginPath();rr(ctx,hx,y,hw,20,3);ctx.fill();ctx.shadowBlur=0;
    // Shine
    ctx.fillStyle='rgba(255,255,255,.22)';ctx.beginPath();rr(ctx,hx,y,hw,7,2);ctx.fill();
    // Notches
    ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1;
    for(let i=1;i<10;i++){const nx=bx+bw*i/10;ctx.beginPath();ctx.moveTo(nx,y);ctx.lineTo(nx,y+20);ctx.stroke()}
  }
  eBar(ctx,f,x,y,bw,flip){
    const r=f.en/f.men,bx=flip?x-bw:x,full=r>=1;
    ctx.fillStyle='#04001a';ctx.strokeStyle='#2030a0';ctx.lineWidth=1.5;
    ctx.beginPath();rr(ctx,bx-1,y-1,bw+2,14,3);ctx.fill();ctx.stroke();
    const ec=full?'#ffe030':'#2060ff';
    ctx.shadowBlur=full?16:5;ctx.shadowColor=ec;ctx.fillStyle=ec;
    ctx.beginPath();rr(ctx,bx,y,bw*r,12,2);ctx.fill();ctx.shadowBlur=0;
    // Segments
    ctx.strokeStyle='rgba(0,0,30,.6)';ctx.lineWidth=1;
    for(let i=1;i<4;i++){ctx.beginPath();ctx.moveTo(bx+bw*i/4,y);ctx.lineTo(bx+bw*i/4,y+12);ctx.stroke()}
  }
  timer(ctx,sec,T){
    const urg=sec<=10,cx=W/2;
    ctx.save();
    ctx.fillStyle=urg?'#2a000a':'#080020';ctx.strokeStyle=urg?'#cc2040':'#6040c0';ctx.lineWidth=2;
    ctx.beginPath();rr(ctx,cx-34,3,68,40,7);ctx.fill();ctx.stroke();
    ctx.textAlign='center';ctx.font=`bold 32px 'Courier New',monospace`;
    ctx.fillStyle=urg?'#ff4060':'#ffffff';
    ctx.shadowBlur=urg?22:10;ctx.shadowColor=urg?'#ff1030':'#8040ff';
    if(urg&&~~(T*2)%2===0){ctx.save();ctx.translate(cx,30);ctx.scale(1.1,1.1);ctx.fillText(String(sec).padStart(2,'0'),0,0);ctx.restore()}
    else ctx.fillText(String(sec).padStart(2,'0'),cx,30);
    ctx.restore();
  }
  wins(ctx,n,max,x,y,col,flip){
    for(let i=0;i<Math.ceil(max/2);i++){
      const ix=flip?x-(i+1)*22:x+i*22;
      ctx.fillStyle=i<n?col:'#1a0830';ctx.strokeStyle=col+'80';ctx.lineWidth=1.5;
      ctx.shadowBlur=i<n?10:0;ctx.shadowColor=col;
      ctx.beginPath();ctx.arc(ix+8,y+8,8,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.shadowBlur=0;
    }
  }
  combo(ctx,f,x,y,flip,T){
    if(f.cb<2)return;
    ctx.save();ctx.textAlign=flip?'right':'left';
    const s=1+Math.min(f.cb,10)*.045;ctx.translate(x,y);ctx.scale(s,s);
    ctx.font=`bold 46px Impact,sans-serif`;
    ctx.strokeStyle='#000';ctx.lineWidth=5;ctx.strokeText(f.cb+' HIT',0,0);
    ctx.fillStyle='#ffd020';ctx.shadowBlur=20;ctx.shadowColor='#ff8800';ctx.fillText(f.cb+' HIT',0,0);
    ctx.font=`bold 14px 'Courier New',monospace`;ctx.fillStyle='#ffaa40';ctx.shadowBlur=8;
    ctx.fillText(f.cbdmg+' DMG',0,20);ctx.restore();
  }
  superReady(ctx,f,x,y,flip,T){
    if(f.en<f.men)return;
    const a=.5+Math.sin(T*6)*.5;
    ctx.save();ctx.globalAlpha=a;ctx.textAlign=flip?'right':'left';
    ctx.font=`bold 10px 'Courier New',monospace`;
    ctx.fillStyle='#ffe040';ctx.shadowBlur=14;ctx.shadowColor='#ffaa00';
    ctx.fillText('★ SUPER ★',x,y);ctx.restore();
  }
  draw(ctx,p1,p2,tim,p1w,p2w,mr,T){
    const BW=340;
    this.hBar(ctx,p1,35,20,BW,false,T);this.hBar(ctx,p2,W-35,20,BW,true,T);
    this.eBar(ctx,p1,35,47,BW*.58,false);this.eBar(ctx,p2,W-35,47,BW*.58,true);
    this.timer(ctx,tim,T);
    this.wins(ctx,p1w,mr,35,64,p1.C.col,false);this.wins(ctx,p2w,mr,W-35,64,p2.C.col,true);
    // Names
    ctx.save();ctx.font=`bold 11px 'Courier New',monospace`;ctx.shadowBlur=6;
    ctx.textAlign='left';ctx.fillStyle=p1.C.col;ctx.shadowColor=p1.C.glow;ctx.fillText(p1.C.name,35,14);
    ctx.textAlign='right';ctx.fillStyle=p2.C.col;ctx.shadowColor=p2.C.glow;ctx.fillText(p2.C.name,W-35,14);
    ctx.restore();
    this.combo(ctx,p1,90,295,false,T);this.combo(ctx,p2,W-90,295,true,T);
    this.superReady(ctx,p1,36,80,false,T);this.superReady(ctx,p2,W-36,80,true,T);
  }
  bigText(ctx,t,x,y,col='#fff',sz=70){
    ctx.save();ctx.textAlign='center';
    ctx.font=`bold ${sz}px Impact,sans-serif`;
    ctx.strokeStyle='#000';ctx.lineWidth=8;ctx.strokeText(t,x,y);
    ctx.fillStyle=col;ctx.shadowBlur=30;ctx.shadowColor=col;ctx.fillText(t,x,y);ctx.restore();
  }
}

// ── GAME ──────────────────────────────────────────────────────
class Game{
  constructor(){
    const cv=document.getElementById('c');
    cv.width=W;cv.height=H;
    // Touch pour démarrer
    cv.addEventListener('touchstart',e=>{this._touchStart=true},{passive:true});
    // Pointer Lock — capture le curseur pour liberer le stick
    const _lock=()=>{cv.requestPointerLock=cv.requestPointerLock||cv.mozRequestPointerLock||cv.webkitRequestPointerLock;if(cv.requestPointerLock)cv.requestPointerLock()};
    cv.addEventListener('click',_lock);
    window.addEventListener('gamepadconnected',_lock);
    // Re-capturer si on perd le lock (seulement sur clic)
    document.addEventListener('pointerlockchange',()=>{});
    const _resize=()=>{
      const sc=Math.min(window.innerWidth/W,window.innerHeight/H);
      cv.style.width=W*sc+'px';cv.style.height=H*sc+'px';
    };
    _resize();
    window.addEventListener('resize',_resize);
    window.addEventListener('orientationchange',()=>setTimeout(_resize,300));
    this.ctx=cv.getContext('2d');
    this.pts=new Pts();this.sfx=new SFX();this.stage=new Stage();this.ui=new UI();
    this.mim=new Input();
    this.state='MENU';this.round=1;this.mr=3;this.p1w=0;this.p2w=0;
    this.timer=99;this.tf=0;this.annT='';this.annF=0;this.annC='#fff';
    this.introF=0;this.reF=0;this.T=0;
    this._build();requestAnimationFrame(ts=>this._loop(ts));
  }
  _showCS(phase){
    if(phase===0){this._p1sel=0;this._p2sel=1;}
    const el=document.getElementById('charsel');
    if(!el)return;
    el.style.display='block';
    const acol=phase===0?'#2ee8ff':'#ff5522';
    const title=document.getElementById('cs-title');
    const sub=document.getElementById('cs-sub');
    const p1el=document.getElementById('cs-p1');
    const cards=document.getElementById('cs-cards');
    if(title){title.textContent=phase===0?'CHOISIS TON PERSONNAGE':"CHOISIS L'ADVERSAIRE";title.style.color=acol}
    if(sub){sub.textContent='Appuie sur CHOISIR';sub.style.color=acol}
    const ckeys=Object.keys(CHARS);
    if(p1el){
      if(phase===1){
        p1el.style.display='block';
        p1el.textContent='Ton perso : '+CHARS[ckeys[this._p1sel]].name;
        p1el.style.color=CHARS[ckeys[this._p1sel]].col;
      } else {
        p1el.style.display='none';
      }
    }
    if(!cards)return;
    cards.innerHTML='';
    const game=this; // capture explicite
    ckeys.forEach(function(cn,i){
      const C=CHARS[cn];
      const div=document.createElement('div');
      div.style.cssText='width:148px;border-radius:12px;border:2px solid '+C.col+';background:rgba(6,0,24,.97);color:#fff;display:flex;flex-direction:column;align-items:center;padding:14px 10px 12px;box-sizing:border-box';
      div.innerHTML='<div style="font-family:Impact;font-size:22px;color:'+C.col+';text-shadow:0 0 8px '+C.glow+';margin-bottom:4px">'+C.name+'</div>'
        +'<div style="font-size:9px;color:'+C.glow+';margin-bottom:8px;text-align:center">'+C.sub+'</div>'
        +'<div style="font-size:9px;color:#aaa;text-align:left;line-height:1.7;width:100%;margin-bottom:8px">'+(C.desc||[]).map(function(d){return'<div>• '+d+'</div>'}).join('')+'</div>'
        +'<div style="font-size:9px;color:#555;margin-bottom:10px">HP: '+C.hp+'</div>'
        +'<button style="width:100%;padding:10px 0;border-radius:20px;border:none;background:'+C.col+';color:#000;font-family:Impact;font-size:14px;cursor:pointer;letter-spacing:1px">CHOISIR</button>';
      div.querySelector('button').addEventListener('click',function(){
        if(game._multiMode){
          _mp.myChar=i;
          if(_mp.conn)_mp.conn.send({type:'charsel',char:i});
          _mp.localReady=true;
          document.getElementById('charsel').style.display='none';
          _showWaitingForOpponent();
          if(_mp.remoteReady)_launchMulti();
          return;
        }
        if(phase===0){
          game._p1sel=i;
          div.style.boxShadow='0 0 28px '+C.col;
          setTimeout(function(){game._showCS(1);},150);
        } else {
          game._p2sel=i;
          // Cacher tous les overlays
          ['charsel','mainmenu','multi-charsel','matchmaking','mp-waiting','multi-wait'].forEach(function(id){
            var ov=document.getElementById(id);if(ov)ov.style.display='none';
          });
          // Construire et lancer
          var c1=ckeys[game._p1sel];
          var c2=ckeys[game._p2sel];
          console.log('SOLO LAUNCH: '+c1+' vs '+c2);
          game._buildWith(c1,c2);
          game._reset();
          game.round=1;game.p1w=0;game.p2w=0;
          game.state='INTRO';game.introF=180;
        }
      });
      cards.appendChild(div);
    });
  }
  _build(){
    this.p1=new Fighter(1,'RYOKEN',240,true,true);
    this.p2=new Fighter(2,'KIRA',720,false,false);
    this.ai=new AI(this.p2);
  }
  _buildWith(cn1,cn2){
    this.p1=new Fighter(1,cn1,240,true,true);
    this.p2=new Fighter(2,cn2,720,false,false);
    this.ai=new AI(this.p2);
  }
  _reset(){
    const r=(f,x,fr)=>{Object.assign(f,{x,y:FLOOR,hp:f.mhp,dhp:f.mhp,en:0,vx:0,vy:0,st:S.IDLE,sT:0,cb:0,cbdmg:0,cbT:0,inv:0,hf:0,hmv:false});f.projs=[];f.aimgs=[];f.fr=fr};
    r(this.p1,240,true);r(this.p2,720,false);
    this.timer=99;this.tf=0;this.pts.list=[];
  }
  ann(t,c='#fff',d=120){this.annT=t;this.annF=d;this.annC=c}

  _loop(ts){
    requestAnimationFrame(ts2=>this._loop(ts2));
    this.T=ts/1000;this.sfx.tick();this.stage.tick();this.mim.flush();
    if(!this.sfx.frozen)this._update();
    this._draw();
  }
  _update(){
    switch(this.state){
      case 'MENU':break;
      case 'INTRO':if(--this.introF<=0){this.state='FIGHT';this.ann('FIGHT !','#ffe020',55)}break;
      case 'FIGHT':this._fight();break;
      case 'RE':if(--this.reF<=0){if(this.p1w>=Math.ceil(this.mr/2)||this.p2w>=Math.ceil(this.mr/2)){this.state='ME'}else{this.round++;this.state='INTRO';this.introF=180;this._reset()}}break;
      case 'ME':if(this.mim.p.size>0||this.mim.pk('GP_START')||this.mim.pk('GP_ATK')||this.mim.pk('GP_JUMP')||this._touchStart){this._touchStart=false;this.round=1;this.p1w=0;this.p2w=0;this._multiMode=false;this.state='MENU';_showMainMenu();}break;
    }
  }
  _fight(){
    if(++this.tf>=60){this.tf=0;this.timer--}
    if(this.timer<=0){this._endRound();return}
    // Multiplayer input sync
    if(this._multiMode){
      this.p1.handleInput(this.p2);
      // Send P1 inputs to opponent
      if(this._multiIsHost){
        _syncMultiInput({
          left:this.p1.im.hk(KB.left),right:this.p1.im.hk(KB.right),
          up:this.p1.im.hk(KB.up),down:this.p1.im.hk(KB.down),
          atk:this.p1.im.pk(KB.atk),sp2:TC.sp2,sp3:TC.sp3,sup:TC.sup
        });
        // P2 = opponent inputs
        this._applyRemoteToP2();
      } else {
        // Client: I am P2
        _syncMultiInput({
          left:this.p1.im.hk(KB.left),right:this.p1.im.hk(KB.right),
          up:this.p1.im.hk(KB.up),down:this.p1.im.hk(KB.down),
          atk:this.p1.im.pk(KB.atk),sp2:TC.sp2,sp3:TC.sp3,sup:TC.sup
        });
        // Apply remote (host=P1) inputs — we ARE P2 locally
        this._applyRemoteToP2();
      }
    } else {
      this.p1.handleInput(this.p2);this.ai.tick(this.p1,this.pts);
    }
    if(this.p1.st===S.SUP&&this.p1.sT===2){this.sfx.slow(90);this.sfx.flash(this.p1.C.col,.6,16);this.sfx.shake(11,25);this._spLbl('SUPER !',this.p1.C.col)}
    if(this.p2.st===S.SUP&&this.p2.sT===2){this.sfx.slow(90);this.sfx.flash(this.p2.C.col,.6,16);this.sfx.shake(11,25);this._spLbl('SUPER !',this.p2.C.col)}
    if(this.p1.st===S.SP2&&this.p1.sT===2)this._spLbl('UPPERCUT !','#ff8820');
    if(this.p1.st===S.SP1&&this.p1.sT===2)this._spLbl('FIREBALL !',this.p1.C.col);
    if(this.p2.st===S.SP2&&this.p2.sT===2)this._spLbl('UPPERCUT !','#ff8820');
    if(this.p2.st===S.SP1&&this.p2.sT===2)this._spLbl('FIREBALL !',this.p2.C.col);
    const skip=this.sfx.slowing&&Math.random()<.52;
    if(!skip){this.p1.tick(this.p2,this.pts);this.p2.tick(this.p1,this.pts)}
    hitCheck(this.p1,this.p2,this.pts,this.sfx);hitCheck(this.p2,this.p1,this.pts,this.sfx);
    if(!skip)this.pts.tick();
    if(this.annF>0)this.annF--;
    if(this.p1.hp<=0||this.p2.hp<=0)this._endRound();
  }
  _applyRemoteToP2(){
    const ri=_getRemoteInput();
    const f=this.p2;
    if(f.isKO()||f.isHurt())return;
    if(f.isAtk()){const m=f.mv;if(m&&f.sT<m.su+m.ac+m.re)return;if(f.grnd)f.go(S.IDLE);return}
    const dn=!!ri.down,up=!!ri.up,lft=!!ri.left,rgt=!!ri.right;
    const atkP=!!ri.atk,sp2P=!!ri.sp2,sp3P=!!ri.sp3,supP=!!ri.sup;
    const fwd=f.fr?rgt:lft,bck=f.fr?lft:rgt;
    if(supP&&f.en>=f.C.eCost){f.go(S.SU);return}
    if(sp2P){f.go(S.SP2);f.vy=-17;if(f.grnd)f.y=FLOOR-1;return}
    if(sp3P&&dn){this._doSP3Remote(f);return}
    if(atkP&&f.air){f.go(S.JA);return}
    if(atkP&&up){this._doSP1Remote(f);return}
    if(atkP&&f.grnd){f.go(S.HP);return}
    if(f.grnd&&bck){f.go(dn?S.BL:S.BH);return}
    if(f.grnd){
      if(up&&!f.air){f.vy=JV;f.y=FLOOR-1;f.go(fwd?S.JF:bck?S.JB:S.JU);f.vx=fwd?(f.fr?WF:-WF):bck?(f.fr?-WB:WB):0;return}
      if(dn){f.go(S.CR);return}
      if(fwd){f.go(S.WF);return}
      if(bck){f.go(S.WB);return}
      f.go(S.IDLE);
    }
  }
  _doSP1Remote(f){
    f.go(S.SP1);const d=f.fr?1:-1;
    if(f.cn==='RYOKEN')f.projs.push(new Proj(f.x+d*44,f.y-74,d,f.id,{spd:9,dmg:85,w:36,h:24,col:f.C.col,glow:f.C.glow,type:'e',life:110}));
    else if(f.cn==='KIRA'){f.vx=d*14}
  }
  _doSP3Remote(f){
    f.go(S.SP3);const d=f.fr?1:-1;
    if(f.cn==='KIRA')f.projs.push(new Proj(f.x+d*30,f.y-64,d,f.id,{spd:5.5,dmg:70,w:52,h:52,col:'#ff5522',glow:'#fa8',type:'f',life:90}));
    else if(f.cn==='RYOKEN'){f.vx=d*9}
    else if(f.cn==='ZERO'){for(let i=0;i<3;i++)f.projs.push(new Proj(f.x+d*30,f.y-60-i*12,d,f.id,{spd:9+i*2,dmg:42,w:24,h:24,col:'#88ddff',glow:'#ccffff',type:'i',life:70}))}
    else if(f.cn==='VEGA'){f.projs.push(new Proj(f.x+d*30,f.y-30,d,f.id,{spd:6,dmg:90,w:70,h:40,col:'#ffcc00',glow:'#ffee88',type:'e',life:95}))}
  }
  _endRound(){
    if(this.state!=='FIGHT')return;
    this.state='RE';this.reF=200;
    this.sfx.hs=0;
    const h1=Math.max(0,this.p1.hp),h2=Math.max(0,this.p2.hp);
    if(h1>h2){this.p1w++;this.ann('TU GAGNES !',this.p1.C.col,220)}
    else if(h2>h1){this.p2w++;this.ann('DÉFAITE !',this.p2.C.col,220)}
    else this.ann('ÉGALITÉ !','#ffa020',200);
    this.sfx.shake(14,22);this.sfx.flash('#fff',.45,10);
  }
  _draw(){
    const ctx=this.ctx;
    ctx.clearRect(0,0,W,H);
    ctx.save();this.sfx.apply(ctx);
    this.stage.draw(ctx);
    // Super aura
    if(this.state!=='MENU')for(const f of[this.p1,this.p2]) if(f&&f.st===S.SUP) this._superAura(f);
    // Fighters (only draw if in combat)
    if(this.state!=='MENU'){
      if(this.p1)this.p1.draw(ctx,this.pts,this.T);
      if(this.p2)this.p2.draw(ctx,this.pts,this.T);
    }
    this.pts.draw(ctx);
    ctx.restore();
    this.sfx.drawFlash(ctx);
    if(this.state!=='MENU'&&this.state!=='INTRO') this.ui.draw(ctx,this.p1,this.p2,this.timer,this.p1w,this.p2w,this.mr,this.T);
    if(this.annF>0){const a=this.annF>30?1:this.annF/30;ctx.save();ctx.globalAlpha=a;this.ui.bigText(ctx,this.annT,W/2,H/2+24,this.annC);ctx.restore()}
    if(this._st>0){this._st--;const sa=Math.min(1,this._st/10);ctx.save();ctx.globalAlpha=sa;ctx.textAlign='center';ctx.font=`bold 30px Impact,sans-serif`;ctx.strokeStyle='#000';ctx.lineWidth=5;ctx.strokeText(this._sl||'',W/2,155);ctx.fillStyle=this._sc||'#fff';ctx.shadowBlur=16;ctx.shadowColor=this._sc||'#fff';ctx.fillText(this._sl||'',W/2,155);ctx.restore()}
    switch(this.state){
      case 'MENU': this._menu(ctx);break;
      case 'INTRO': this._intro(ctx);break;
      case 'ME': this._matchEnd(ctx);break;
    }
  }
  _spLbl(txt,col){this._sl=txt;this._sc=col;this._st=45}
  _superAura(f){
    const ctx=this.ctx,C=f.C,T=this.T;
    ctx.save();
    for(let i=3;i>=0;i--){
      const r=55+i*20+Math.sin(T*12+i)*8;
      ctx.globalAlpha=(.3-i*.06)*(f.sT%8<4?1:.55);
      ctx.strokeStyle=C.glow;ctx.lineWidth=2.5-i*.4;ctx.shadowBlur=16;ctx.shadowColor=C.glow;
      ctx.beginPath();ctx.arc(f.x,f.y-f.h*.5,r,0,Math.PI*2);ctx.stroke();
    }
    ctx.restore();
    if(Math.random()<.75)this.pts.burst(f.x,f.y-f.h*.55,3,[C.glow,C.col,'#fff'],8,[2,5]);
  }

  _menu(ctx){
    // Canvas background only — HTML mainmenu overlay handles display
    const T=this.T;
    // Just draw the stage as background, no fighter names
  }
  _vsCard(ctx,f,x,y,align,T){
    const C=f.C,flip=align==='right',bx=flip?x-170:x,bw=170,bh=60;
    ctx.save();
    ctx.fillStyle='rgba(10,0,30,.7)';ctx.strokeStyle=C.col+'80';ctx.lineWidth=1.5;
    ctx.beginPath();rr(ctx,bx,y-10,bw,bh,6);ctx.fill();ctx.stroke();
    ctx.textAlign=flip?'right':'left';
    const tx=flip?x-12:x+12;
    ctx.font=`bold 22px 'Courier New',monospace`;ctx.fillStyle=C.col;ctx.shadowBlur=10;ctx.shadowColor=C.glow;
    ctx.fillText(C.name,tx,y+18);
    ctx.font=`10px 'Courier New',monospace`;ctx.fillStyle='#7060a0';ctx.shadowBlur=0;
    ctx.fillText(C.sub,tx,y+36);
    // Tiny color blob
    ctx.fillStyle=C.col;ctx.shadowBlur=8;ctx.shadowColor=C.glow;
    ctx.beginPath();ctx.arc(flip?bx+16:bx+bw-16,y+30,10,0,Math.PI*2);ctx.fill();ctx.restore();
  }

  _intro(ctx){
    ctx.fillStyle='rgba(1,0,14,.82)';ctx.fillRect(0,0,W,H);
    const total=180,elapsed=total-this.introF;
    const slide=Math.max(0,1-elapsed/28);
    const fadeIn=a=>Math.min(1,elapsed/(a||20));

    // Get actual chosen char data
    const p1n=this.p1?.C?.name||'P1', p1c=this.p1?.C?.col||'#2ee8ff', p1g=this.p1?.C?.glow||'#9ef', p1s=this.p1?.C?.sub||'';
    const p2n=this.p2?.C?.name||'P2', p2c=this.p2?.C?.col||'#ff5522', p2g=this.p2?.C?.glow||'#fa8', p2s=this.p2?.C?.sub||'';

    ctx.save();

    // ── P1 block — slides from left ──
    ctx.globalAlpha=fadeIn(18);
    const p1x=80-slide*180;
    ctx.textAlign='left';
    ctx.font=`bold 44px Impact,sans-serif`;
    ctx.strokeStyle='#000';ctx.lineWidth=6;
    ctx.shadowBlur=0;ctx.strokeText(p1n,p1x,H/2-18);
    ctx.fillStyle=p1c;ctx.shadowBlur=18;ctx.shadowColor=p1g;ctx.fillText(p1n,p1x,H/2-18);
    ctx.font=`12px 'Courier New',monospace`;ctx.fillStyle=p1g;ctx.shadowBlur=0;ctx.fillText(p1s,p1x,H/2+8);

    // ── P2 block — slides from right ──
    const p2x=W-80+slide*180;
    ctx.textAlign='right';
    ctx.font=`bold 44px Impact,sans-serif`;
    ctx.strokeStyle='#000';ctx.lineWidth=6;
    ctx.shadowBlur=0;ctx.strokeText(p2n,p2x,H/2-18);
    ctx.fillStyle=p2c;ctx.shadowBlur=18;ctx.shadowColor=p2g;ctx.fillText(p2n,p2x,H/2-18);
    ctx.font=`12px 'Courier New',monospace`;ctx.fillStyle=p2g;ctx.shadowBlur=0;ctx.fillText(p2s,p2x,H/2+8);

    // ── VS ──
    if(elapsed>16){
      ctx.globalAlpha=fadeIn(12)*(0.5+Math.sin(this.T*8)*.5)*0.3+fadeIn(12)*0.7;
      ctx.textAlign='center';ctx.font=`bold 58px Impact,sans-serif`;
      ctx.strokeStyle='#000';ctx.lineWidth=7;ctx.shadowBlur=0;ctx.strokeText('VS',W/2,H/2-12);
      ctx.fillStyle='#fff';ctx.shadowBlur=24;ctx.shadowColor='#8040ff';ctx.fillText('VS',W/2,H/2-12);
    }

    // ── Matchup text eg "ZERO vs VEGA" ──
    if(elapsed>30){
      ctx.globalAlpha=Math.min(1,(elapsed-30)/15);
      ctx.textAlign='center';ctx.font=`13px 'Courier New',monospace`;
      ctx.fillStyle='rgba(150,130,200,.7)';ctx.shadowBlur=0;
      ctx.fillText(p1n+' vs '+p2n+' — Round '+this.round,W/2,H/2+42);
    }

    // ── 3-2-1 countdown ──
    const secLeft=Math.ceil(this.introF/60);
    if(secLeft>=1&&secLeft<=3&&elapsed>22){
      const pulse=1+(1-(this.introF%60)/60)*0.45;
      const col=secLeft===1?'#ff3030':secLeft===2?'#ffaa00':'#22ff88';
      ctx.globalAlpha=0.92;ctx.textAlign='center';
      ctx.save();ctx.translate(W/2,H/2+100);ctx.scale(pulse,pulse);
      ctx.font=`bold 80px Impact,sans-serif`;
      ctx.strokeStyle='#000';ctx.lineWidth=9;ctx.shadowBlur=0;ctx.strokeText(secLeft,0,0);
      ctx.fillStyle=col;ctx.shadowBlur=28;ctx.shadowColor=col;ctx.fillText(secLeft,0,0);
      ctx.restore();
    }

    ctx.restore();
  }
  _matchEnd(ctx){
    const T=this.T;
    ctx.fillStyle='rgba(1,0,14,.88)';ctx.fillRect(0,0,W,H);
    const win=this.p1w>this.p2w?this.p1:this.p2;
    ctx.save();ctx.textAlign='center';
    ctx.font=`bold 90px Impact,sans-serif`;
    ctx.strokeStyle='#000';ctx.lineWidth=9;ctx.strokeText('K.O.',W/2,195);
    ctx.fillStyle='#ff2040';ctx.shadowBlur=38;ctx.shadowColor='#ff0020';ctx.fillText('K.O.',W/2,195);
    ctx.font=`bold 46px Impact,sans-serif`;
    ctx.strokeStyle='#000';ctx.lineWidth=5;ctx.strokeText(win.C.name+' GAGNE !',W/2,260);
    ctx.fillStyle=win.C.col;ctx.shadowColor=win.C.glow;ctx.fillText(win.C.name+' GAGNE !',W/2,260);
    ctx.font=`14px 'Courier New',monospace`;ctx.fillStyle='#7060a0';ctx.shadowBlur=0;
    ctx.fillText(`${this.p1.C.name}: ${this.p1w}V  ·  ${this.p2.C.name}: ${this.p2w}V`,W/2,306);
    const p=.5+Math.sin(T*3)*.5;
    ctx.globalAlpha=p;ctx.font=`16px 'Courier New',monospace`;ctx.fillStyle='#aaa';
    ctx.fillText('APPUYEZ SUR UNE TOUCHE POUR REJOUER',W/2,380);ctx.restore();
  }
}

function _roomCode(){
  // Rotating slot changes every 30s — auto-matches nearby players
  return 'NC-'+(Math.floor(Date.now()/30000)%9999).toString().padStart(4,'0');
}
function _customCode(v){return 'NC-USER-'+v.toUpperCase().replace(/[^A-Z0-9]/g,'')}



function _tryJoinCode(roomId){
  _setStatus("onnexion à l'adversaire...'");
  const peer=new Peer(undefined,{debug:0});
  _mp.peer=peer;
  peer.on('open',()=>{
    const conn=peer.connect(roomId,{reliable:true,serialization:'json'});
    conn.on('open',()=>_onConnect(conn,false));
    conn.on('error',e=>_setStatus('Impossible de rejoindre ce code'));
  });
  peer.on('error',e=>_setStatus('Erreur connexion: '+e.type));
}



function _onDisconnect(){
  if(window._game){
    window._game.state='MENU';
    _showMainMenu();
  }
  alert('Adversaire déconnecté !');
}


function _showMultiCharsel(){
  const el=document.getElementById('multi-charsel');
  if(!el)return;
  el.style.display='flex';
  const title=document.getElementById('mcs-title');
  const cards=document.getElementById('mcs-cards');
  if(title)title.textContent=_mp.isHost?'Tu joues P1 — Choisis ton personnage':'Tu joues P2 — Choisis ton personnage';
  if(!cards)return;
  cards.innerHTML='';
  const ckeys=Object.keys(CHARS);
  ckeys.forEach((cn,i)=>{
    const C=CHARS[cn];
    const div=document.createElement('div');
    div.style.cssText='width:150px;border-radius:12px;border:2px solid '+C.col+';background:rgba(6,0,24,.97);color:#fff;display:flex;flex-direction:column;align-items:center;padding:14px 10px 12px;box-sizing:border-box;cursor:pointer';
    div.innerHTML='<div style="font-family:Impact;font-size:22px;color:'+C.col+';text-shadow:0 0 8px '+C.glow+';margin-bottom:4px">'+C.name+'</div>'
      +'<div style="font-size:9px;color:'+C.glow+';margin-bottom:8px;text-align:center">'+C.sub+'</div>'
      +'<div style="font-size:9px;color:#aaa;text-align:left;line-height:1.7;width:100%;margin-bottom:8px">'+((C.desc||[]).slice(0,3).map(d=>'<div>• '+d+'</div>').join(''))+'</div>'
      +'<div style="font-size:9px;color:#555;margin-bottom:10px">HP: '+C.hp+'</div>'
      +'<button style="width:100%;padding:10px 0;border-radius:20px;border:none;background:'+C.col+';color:#000;font-family:Impact;font-size:14px;cursor:pointer;-webkit-tap-highlight-color:transparent">CHOISIR</button>';
    div.querySelector('button').addEventListener('click',()=>_multiPickChar(i));
    cards.appendChild(div);
  });
}

function _multiPickChar(idx){
  _mp.myChar=idx;
  _mp.localReady=true;
  // Send pick to opponent
  if(_mp.conn)_mp.conn.send({type:'charsel',char:idx});
  // Hide charsel, show VS screen in waiting state
  const el=document.getElementById('multi-charsel');if(el)el.style.display='none';
  _showMpVs();
  // If opponent already picked, launch
  if(_mp.remoteReady)_launchMulti();
}

function _showMpVs(){
  const el=document.getElementById('mp-vs');if(!el)return;
  el.style.display='flex';
  const ckeys=Object.keys(CHARS);
  const myC=CHARS[ckeys[_mp.myChar]];
  // My card
  const p1el=document.getElementById(_mp.isHost?'mpvs-p1':'mpvs-p2');
  const p2el=document.getElementById(_mp.isHost?'mpvs-p2':'mpvs-p1');
  if(p1el)p1el.innerHTML='<div style="font-size:10px;color:#555;letter-spacing:2px;margin-bottom:6px">TOI</div><div style="font-family:Impact;font-size:26px;color:'+myC.col+';text-shadow:0 0 12px '+myC.glow+'">'+myC.name+'</div>';
  if(p2el)p2el.innerHTML='<div style="font-size:10px;color:#555;letter-spacing:2px;margin-bottom:6px">ADVERSAIRE</div><div style="font-family:Impact;font-size:26px;color:#444">???</div>';
  const st=document.getElementById('mpvs-status');
  if(st)st.textContent='En attente du choix adverse...';
}

function _updateMpVsOpp(){
  const ckeys=Object.keys(CHARS);
  const oppC=CHARS[ckeys[_mp.oppChar]];
  const p2el=document.getElementById(_mp.isHost?'mpvs-p2':'mpvs-p1');
  if(p2el&&oppC)p2el.innerHTML='<div style="font-size:10px;color:#555;letter-spacing:2px;margin-bottom:6px">ADVERSAIRE</div><div style="font-family:Impact;font-size:26px;color:'+oppC.col+';text-shadow:0 0 12px '+oppC.glow+'">'+oppC.name+'</div>';
  const st=document.getElementById('mpvs-status');
  if(st)st.textContent='Lancement dans 2 secondes...';
}

function _showWaitingForOpponent(){
  const overlay=document.getElementById('matchmaking');
  overlay.style.display='flex';
  document.getElementById('mm-timer').textContent='⏳';
  document.getElementById('mm-found').style.display='none';
  _setStatus("En attente du choix de l'adversaire...");
  document.getElementById('mm-cancel').style.display='none';
  document.getElementById('mm-code').style.display='none';
  const ring=document.getElementById('mm-ring');
  if(ring){const c=ring.getContext('2d');c.clearRect(0,0,120,120)}
}



function _setStatus(txt){const e=document.getElementById('mm-status');if(e)e.textContent=txt}

function _drawRing(t,max){
  const ctx=_mp.ringCtx;if(!ctx)return;
  ctx.clearRect(0,0,120,120);
  const cx=60,cy=60,r=50;
  // BG ring
  ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=8;
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();
  // Progress ring
  const prog=(t/max)*Math.PI*2;
  const col=t>5?'#22ff88':t>2?'#ffa020':'#ff4444';
  ctx.strokeStyle=col;ctx.lineWidth=8;ctx.shadowBlur=12;ctx.shadowColor=col;
  ctx.lineCap='round';
  ctx.beginPath();ctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+prog);ctx.stroke();
  ctx.shadowBlur=0;
}

function _syncMultiInput(inp){
  // Called each frame from handleInput
  if(_mp.conn&&_mp.connected){
    _mp.conn.send({type:'input',inp});
  }
}
