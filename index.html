<body>

    <button class="tb" id="tsup" style="right:140px;top:44px;width:56px;height:56px;background:rgba(200,200,0,.65);font-size:11px">SUP★</button>

<script>
'use strict';
const W=960,H=540,FLOOR=430,SL=70,SR=890,GRV=0.62,JV=-16,WF=4.8,WB=3.8;

// ── Touch ──────────────────────────────────────────────────
const TC={left:false,right:false,up:false,down:false,atk:false,sp2:false,sp3:false,sup:false,any:false};
function tbind(id,k){
  const el=document.getElementById(id);if(!el)return;
  const on=e=>{e.preventDefault();TC[k]=true;TC.any=true};
  const off=e=>{e.preventDefault();TC[k]=false};
  el.addEventListener('touchstart',on,{passive:false});
  el.addEventListener('touchend',off,{passive:false});
  el.addEventListener('mousedown',on);el.addEventListener('mouseup',off);
}
window.addEventListener('load',()=>{
  if('ontouchstart' in window||navigator.maxTouchPoints>0){
    document.getElementById('tc').style.display='block';
    const dp=document.getElementById('dpad');
    const bt=document.getElementById('btns');
    dp.style.height='148px';bt.style.height='148px';
  }
  tbind('tl','left');tbind('tr','right');tbind('tu','up');tbind('td','down');
  tbind('tatk','atk');tbind('tsp2','sp2');tbind('tsp3','sp3');tbind('tsup','sup');
});

// ── States ─────────────────────────────────────────────────
const S={I:'I',WF:'WF',WB:'WB',CR:'CR',JU:'JU',JF:'JF',JB:'JB',
  LP:'LP',MP:'MP',HP:'HP',CL:'CL',CM:'CM',CH:'CH',JA:'JA',
  S1:'S1',S2:'S2',S3:'S3',SU:'SU',
  BH:'BH',BL:'BL',HT:'HT',KD:'KD',GU:'GU',KO:'KO'};

// ── Input ──────────────────────────────────────────────────
const _gpStore={pad:null};
window.addEventListener('gamepadconnected',e=>{_gpStore.pad=e.gamepad});
window.addEventListener('gamepaddisconnected',()=>{_gpStore.pad=null});
class Input{
  constructor(){this.h=new Set();this.p=new Set();this._b=new Set();this._gpPrev={};
    window.addEventListener('keydown',e=>{if(!this.h.has(e.code))this._b.add(e.code);this.h.add(e.code);e.preventDefault()});
    window.addEventListener('keyup',e=>this.h.delete(e.code));
  }
  _gp(){try{const gs=navigator.getGamepads?navigator.getGamepads():[];for(const g of gs)if(g){if(!_gpStore.pad)_gpStore.pad=g;return g}}catch(e){}return null}
  flush(){
    this.p=new Set(this._b);this._b.clear();
    const g=this._gp();if(!g)return;
    const map={'GL':!!g.buttons[14]?.pressed,'GR':!!g.buttons[15]?.pressed,'GU':!!g.buttons[12]?.pressed,'GD':!!g.buttons[13]?.pressed,
      'GA':!!g.buttons[1]?.pressed,'GJ':!!g.buttons[0]?.pressed,'GS2':!!g.buttons[5]?.pressed,
      'GS3':!!g.buttons[3]?.pressed,'GSU':!!g.buttons[7]?.pressed,'GST':!!g.buttons[9]?.pressed};
    for(const[k,v]of Object.entries(map)){if(v&&!this._gpPrev[k]){this._b.add(k);this.h.add(k)}else if(!v)this.h.delete(k)}
    this._gpPrev={...map};
  }
  hk(k){return this.h.has(k)} pk(k){return this.p.has(k)}
  get hasGP(){return!!this._gp()}
}
const KB={l:'KeyQ',r:'KeyD',u:'KeyZ',d:'KeyS',a:'KeyR'};

// ── Particles ──────────────────────────────────────────────
class Pt{constructor(x,y,vx,vy,l,r,c,g=0.18,dc=0.92){Object.assign(this,{x,y,vx,vy,l,ml:l,r,c,g,dc,ring:false,rr:0})}
  tick(){this.x+=this.vx;this.y+=this.vy;this.vy+=this.g;this.vx*=this.dc;this.l--;return this.l>0}
  get a(){return this.l/this.ml}
}
class Pts{
  constructor(){this.list=[]}
  burst(x,y,n,cols,spd=7,rl=[2,7]){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=spd*(.3+Math.random()*.9),r=rl[0]+Math.random()*(rl[1]-rl[0]);this.list.push(new Pt(x,y,Math.cos(a)*s,Math.sin(a)*s,16+~~(Math.random()*16),r,cols[i%cols.length]))}}
  spark(x,y,n,c,dx=0){for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.random()-.5)*2,s=3+Math.random()*6;this.list.push(new Pt(x,y,Math.cos(a)*s+dx*1.2,Math.sin(a)*s-1,8+~~(Math.random()*10),1.5+Math.random()*2.5,c,.3,.88))}}
  ring(x,y,c){const p=new Pt(x,y,0,0,22,0,c,0,1);p.ring=true;p.rr=0;this.list.push(p)}
  trail(x,y,c,r=3){this.list.push(new Pt(x,y,(Math.random()-.5),(Math.random()-.5),14,r,c,-.03,.9))}
  tick(){this.list=this.list.filter(p=>p.tick())}
  draw(ctx){for(const p of this.list){ctx.save();ctx.globalAlpha=p.a*.92;if(p.ring){ctx.strokeStyle=p.c;ctx.lineWidth=2.5;ctx.shadowBlur=10;ctx.shadowColor=p.c;ctx.globalAlpha=p.a*.65;ctx.beginPath();ctx.arc(p.x,p.y,p.rr,0,Math.PI*2);ctx.stroke();p.rr+=(1-p.a)*55+1.5}else{ctx.shadowBlur=7;ctx.shadowColor=p.c;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.restore()}}
}

// ── Screen FX ──────────────────────────────────────────────
class SFX{
  constructor(){this.sk=0;this.sx=0;this.sy=0;this.fi=0;this.fc=null;this.fa=0;this.hs=0;this.sl=0}
  shake(i,d){this.sk=d;this._si=i} flash(c,a=.5,d=8){this.fc=c;this.fa=a;this.fi=d;this._fd=d}
  hitStop(f=5){this.hs=Math.max(this.hs,f)} slow(d=80){this.sl=d}
  get frozen(){return this.hs>0} get slowing(){return this.sl>0}
  tick(){if(this.sk>0){this.sk--;this.sx=(Math.random()-.5)*this._si*2.2;this.sy=(Math.random()-.5)*this._si*1.5}else{this.sx=0;this.sy=0}
    if(this.fi>0){this.fi--;this.fa=.55*(this.fi/this._fd)}if(this.hs>0)this.hs--;if(this.sl>0)this.sl--}
  apply(ctx){ctx.translate(this.sx,this.sy)}
  drawFlash(ctx){if(this.fi>0&&this.fc){ctx.save();ctx.globalAlpha=this.fa;ctx.fillStyle=this.fc;ctx.fillRect(0,0,W,H);ctx.restore()}}
}

// ── Projectile ─────────────────────────────────────────────
class Proj{
  constructor(x,y,dir,oid,c){this.x=x;this.y=y;this.vx=dir*(c.spd||8);this.vy=c.vy||0;this.oid=oid;this.dmg=c.dmg||80;this.w=c.w||36;this.h=c.h||22;this.col=c.col||'#4af';this.glow=c.glow||'#9ef';this.type=c.type||'e';this.life=c.life||115;this.active=true;this.ang=0}
  get hb(){return{x:this.x-this.w/2,y:this.y-this.h/2,w:this.w,h:this.h}}
  tick(){this.x+=this.vx;this.y+=this.vy;this.ang+=.15;this.life--;if(this.life<=0||this.x<-80||this.x>W+80)this.active=false}
  draw(ctx,pts,T){
    if(!this.active)return;
    ctx.save();ctx.shadowBlur=24;ctx.shadowColor=this.glow;
    if(this.type==='e'){
      // Energy orb with rotating ring
      const g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.w*.7);
      g.addColorStop(0,'#fff');g.addColorStop(.3,this.glow);g.addColorStop(1,this.col+'00');
      ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(this.x,this.y,this.w*.7,this.h*.6,0,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=this.glow;ctx.lineWidth=2;ctx.globalAlpha=.7;
      ctx.beginPath();ctx.ellipse(this.x,this.y,this.w*.8,this.h*.4,this.ang,0,Math.PI*2);ctx.stroke();
      ctx.globalAlpha=1;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(this.x,this.y,this.w*.2,0,Math.PI*2);ctx.fill();
    } else if(this.type==='f'){
      // Flame ball
      for(let i=2;i>=0;i--){const ox=i*8*(this.vx>0?-1:1);ctx.globalAlpha=.88-i*.25;ctx.fillStyle=i===0?'#fff':this.col;ctx.beginPath();ctx.ellipse(this.x+ox,this.y+Math.sin(T*13+i)*2.5,this.w*.5-i*5,this.h*.42,0,0,Math.PI*2);ctx.fill()}
    } else if(this.type==='i'){
      // Ice shard
      ctx.fillStyle=this.col;ctx.strokeStyle='#fff';ctx.lineWidth=1;
      ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.ang*2);
      ctx.beginPath();ctx.moveTo(0,-this.h*.7);ctx.lineTo(this.w*.3,0);ctx.lineTo(0,this.h*.7);ctx.lineTo(-this.w*.3,0);ctx.closePath();
      ctx.fill();ctx.stroke();ctx.restore();
    }
    ctx.restore();
    if(Math.random()<.4)pts.trail(this.x-this.vx*2.5,this.y,this.glow,3.5);
  }
}

function mv(su,ac,re,dmg,kx,ky,hbs,p={}){return{su,ac,re,dmg,kx,ky,hbs,p}}

const CHARS={

      [S.S1]:mv(14,0,30,0,  0, 0,[],{proj:1}),                              // Fireball
      [S.S2]:mv(4,16,28,130,3,-14,[{ox:22,oy:80,w:50,h:78}],{anti:1,inv:7}), // Uppercut

    moves:{
      [S.LP]:mv(3,4,8,  55, 4,-1,[{ox:46,oy:56,w:56,h:28}]),
      [S.MP]:mv(6,5,12, 98, 6,-2,[{ox:52,oy:52,w:68,h:34}]),
      [S.HP]:mv(10,6,19,155,9,-5,[{ox:54,oy:48,w:80,h:40}]),
      [S.CL]:mv(3,3,8,  46, 3, 0,[{ox:42,oy:18,w:52,h:20}],{low:1}),
      [S.CM]:mv(6,4,13, 86, 5, 0,[{ox:48,oy:28,w:62,h:24}],{low:1}),
      [S.CH]:mv(11,5,21,145,11,0,[{ox:50,oy:20,w:72,h:26}],{low:1,kd:1}),
      [S.JA]:mv(5,8,9,  95, 5,-7,[{ox:26,oy:30,w:56,h:42}],{ovhd:1}),
      [S.S1]:mv(7,20,22,120,15,0,[{ox:58,oy:56,w:115,h:56}],{dash:1}),       // Dash
      [S.S2]:mv(5,12,22,115,2,-15,[{ox:16,oy:90,w:46,h:84}],{anti:1,inv:5}), // Flame uppercut
      [S.S3]:mv(12,16,20,110,7,-3,[{ox:40,oy:56,w:80,h:68}],{proj:1}),       // Fire ball
      [S.SU]:mv(18,44,38,340,12,-2,[{ox:0,oy:70,w:800,h:95}],{sup:1,multi:5}),

    spDesc:{S1:'Dash Infernal',S2:'Uppercut Flamme',S3:'Boule de Feu',SU:'Tornade Infernale'},
  },
  ZERO:{
    name:'ZERO', sub:'Assassin de Glace',
    desc:['Lame de glace (↑SP)','Téléport (↓SP→haut)','Shuriken glace (↓SP)','SUPER: Blizzard total'],
    col:'#88ddff',col2:'#224488',glow:'#ccffff',trim:'#aaffff',hp:900,
    moves:{
      [S.LP]:mv(3,3,7,  50, 5,-1,[{ox:48,oy:56,w:58,h:26}]),
      [S.MP]:mv(5,5,11, 95, 7,-2,[{ox:52,oy:50,w:70,h:32}]),
      [S.HP]:mv(9,6,18, 150,10,-6,[{ox:54,oy:46,w:84,h:40}]),
      [S.CL]:mv(3,3,8,  44, 3, 0,[{ox:44,oy:18,w:52,h:20}],{low:1}),
      [S.CM]:mv(5,4,12, 84, 5, 0,[{ox:50,oy:26,w:62,h:24}],{low:1}),
      [S.CH]:mv(10,5,20,140,12,0,[{ox:48,oy:20,w:72,h:26}],{low:1,kd:1}),
      [S.JA]:mv(4,8,8,  90, 6,-8,[{ox:24,oy:28,w:54,h:42}],{ovhd:1}),
      [S.S1]:mv(10,12,22,100,8,-8,[{ox:20,oy:70,w:44,h:110}],{anti:1,inv:6}), // Ice lance vertical
      [S.S2]:mv(6,0,25,0,  0, 0,[],{teleport:1}),                              // Teleport behind
      [S.S3]:mv(8,0,20,0,  0, 0,[],{proj:1}),                                  // Ice shuriken
      [S.SU]:mv(16,48,40,360,8,-2,[{ox:0,oy:65,w:800,h:90}],{sup:1,freeze:1}),
    },eCost:100,
    spDesc:{S1:'Lame Glaciale',S2:'Téléport',S3:'Shuriken Glace',SU:'Blizzard Total'},
  },
};

// ── Fighter ────────────────────────────────────────────────
class Fighter{
  constructor(id,cn,sx,fr,isHuman){
    this.id=id;this.cn=cn;this.C=CHARS[cn];
    this.x=sx;this.y=FLOOR;this.vx=0;this.vy=0;this.fr=fr;
    this.w=48;this.h=118;
    this.hp=this.C.hp;this.mhp=this.C.hp;this.dhp=this.C.hp;
    this.en=0;this.men=100;
    this.st=S.I;this.sT=0;this.animT=0;
    this.hf=0;this.inv=0;this.frozen=0;
    this.cb=0;this.cbdmg=0;this.cbT=0;
    this.hmv=false;this.hcnt=0;this.lhT=0;
    this.projs=[];this.aimgs=[];this.isHuman=isHuman;
    if(isHuman){this.im=new Input()}
  }
  get grnd(){return this.y>=FLOOR}
  get air(){return!this.grnd}
  isAtk(){return[S.LP,S.MP,S.HP,S.CL,S.CM,S.CH,S.JA,S.S1,S.S2,S.S3,S.SU].includes(this.st)}
  isBlk(){return this.st===S.BH||this.st===S.BL}
  isKO(){return this.st===S.KO}
  isHurt(){return[S.HT,S.KD,S.GU].includes(this.st)}
  get mv(){return this.C.moves[this.st]}
  get hbs(){
    const m=this.mv;if(!m||!m.hbs.length)return[];
    if(this.sT<m.su||this.sT>=m.su+m.ac)return[];
    if(this.hmv&&!m.p.multi)return[];
    if(this.hmv&&m.p.multi&&this.hcnt>=m.p.multi)return[];
    if(this.hmv&&this.sT-this.lhT<5)return[];
    const d=this.fr?1:-1;
    return m.hbs.map(h=>({x:this.x+d*h.ox-(this.fr?0:h.w),y:this.y-h.oy-h.h,w:h.w,h:h.h}));
  }
  get hurt(){
    if(this.inv>0||this.frozen>0||this.isKO())return null;
    const cr=[S.CR,S.BL,S.CL,S.CM,S.CH].includes(this.st);
    const h=cr?this.h*.62:this.h;
    return{x:this.x-this.w/2,y:this.y-h,w:this.w,h};
  }
  go(ns){
    if(this.st===ns)return;this.st=ns;this.sT=0;this.hmv=false;this.hcnt=0;
    if(ns===S.S2&&this.cn!=='ZERO'){this.vy=-17;if(this.grnd)this.y=FLOOR-1;if(this.mv?.p.inv)this.inv=this.mv.p.inv}
    if(ns===S.S1&&this.cn==='KIRA'){this.vx=this.fr?14:-14}
    if(ns===S.S3&&this.cn==='RYOKEN'){this.vx=this.fr?9:-9}
    if(ns===S.SU){this.en=0}
  }
  recHit(m,aFR,pts){
    if(this.inv>0||this.frozen>0||this.isKO())return false;
    const blk=this._blk(m,aFR);
    this.hf=8;const kd=aFR?1:-1;
    if(blk){this.hp=Math.max(0,this.hp-Math.floor(m.dmg*.08));this.en=Math.min(this.men,this.en+4);this.vx=kd*m.kx*.4;this.sT=0;return true}
    this.hp=Math.max(0,this.hp-m.dmg);
    this.en=Math.min(this.men,this.en+m.dmg*.14);
    if(m.p.freeze){this.frozen=120;this.vx=0;this.vy=0}
    else if(m.p.kd||m.p.sup||this.hp<=0){this.go(this.hp<=0?S.KO:S.KD);this.vx=kd*m.kx*1.3;this.vy=-6}
    else{this.go(S.HT);this.vx=kd*m.kx;this.vy=m.ky<0?m.ky:0}
    const hx=this.x,hy=this.y-this.h*.55;
    pts.spark(hx,hy,15,this.C.col,kd);pts.burst(hx,hy,9,['#fff','#ff8',this.C.glow],5.5,[2,6]);pts.ring(hx,hy,this.C.glow);
    return true;
  }
  _blk(m,aFR){
    if(!this.isBlk()||this.air||this.fr===aFR)return false;
    if(m.p.low&&this.st!==S.BL)return false;
    if(m.p.ovhd&&this.st===S.BL)return false;
    return true;
  }
  handleInput(opp){
    if(!this.isHuman)return;
    const im=this.im;im.flush();
    if(this.isKO()||this.isHurt()||this.frozen>0)return;
    if(this.isAtk()){const m=this.mv;if(m&&this.sT<m.su+m.ac+m.re)return;if(this.grnd)this.go(S.I);return}
    const dn=im.hk(KB.d)||im.hk('GD')||TC.down;
    const up=im.hk(KB.u)||im.hk('GU')||TC.up;
    const lft=im.hk(KB.l)||im.hk('GL')||TC.left;
    const rgt=im.hk(KB.r)||im.hk('GR')||TC.right;
    const atkP=im.pk(KB.a)||im.pk('GA')||TC.atk;
    const sp2P=im.pk('GS2')||TC.sp2;
    const sp3P=im.pk('GS3')||TC.sp3;
    const supP=im.pk('GSU')||TC.sup;

    if(sp3P||((atkP||sp3P)&&dn)){this._doS3();return}
    if(atkP&&(up||im.pk('GJ'))){this._doS1();return}
    // Attaque
    if(atkP){
      if(this.air){this.go(S.JA);return}
      if(dn){this.go(S.HP);return}
      this.go(S.HP);return;
    }

    if(this.grnd&&bck){this.go(dn?S.BL:S.BH);return}

    if(this.grnd){
      if(up){this._jump(fwd,bck);return}
      if(dn){this.go(S.CR);return}
      if(fwd){this.go(S.WF);return}
      if(bck){this.go(S.WB);return}
      this.go(S.I);
    }

  tick(opp,pts){

// ── AI ─────────────────────────────────────────────────────
class AI{
  constructor(f,diff=1){this.f=f;f.isHuman=false;this.t=0;this.bt=0;this.diff=diff}
  tick(opp,pts){
    const f=this.f;if(f.isKO()||f.isHurt()||f.frozen>0)return;if(f.isAtk())return;
    if(this.bt>0){this.bt--;return}
    const react=Math.max(6,16-this.diff*3);
    if(--this.t>0)return;
    this.t=react+~~(Math.random()*react);
    const dist=Math.abs(f.x-opp.x),er=f.en/f.men;
    if(er>=1&&dist<200&&Math.random()<.65+this.diff*.08){f.go(S.SU);return}
    if(opp.air&&dist<140&&Math.random()<.7+this.diff*.06){this._sp(S.S2,opp,pts);return}
    if(dist>220&&Math.random()<.4+this.diff*.06){this._sp(S.S1,opp,pts);return}
    if(dist<90){
      const r=Math.random();
      const blkChance=.08+this.diff*.03;
      if(r<blkChance){f.go(S.BH);this.bt=14+~~(Math.random()*8);return}
      if(r<blkChance+.2){f.go(S.LP);return}
      if(r<blkChance+.38){f.go(S.MP);return}
      if(r<blkChance+.52){f.go(S.HP);return}
      if(r<blkChance+.62){f.go(S.CL);return}
      if(r<blkChance+.74){this._sp(S.S1,opp,pts);return}
      if(r<blkChance+.86){this._sp(S.S3,opp,pts);return}
      f.go(S.BH);this.bt=10;
    } else {
      f.go(f.x<opp.x?(f.fr?S.WF:S.WB):(f.fr?S.WB:S.WF));this.t=14;
    }
  }
  _sp(which,opp,pts){
    const f=this.f;f.go(which);
    if(which===S.S1&&f.cn==='RYOKEN'){const d=f.fr?1:-1;f.projs.push(new Proj(f.x+d*44,f.y-74,d,f.id,{spd:9,dmg:85,w:36,h:24,col:f.C.col,glow:f.C.glow,type:'e',life:110}))}
    if(which===S.S3&&f.cn==='KIRA'){const d=f.fr?1:-1;f.projs.push(new Proj(f.x+d*30,f.y-64,d,f.id,{spd:5.5,dmg:70,w:52,h:52,col:'#ff5522',glow:'#fa8',type:'f',life:90}))}
    if(which===S.S3&&f.cn==='ZERO'){const d=f.fr?1:-1;for(let i=0;i<3;i++)setTimeout(()=>f.projs.push(new Proj(f.x+d*30,f.y-60-i*10,d,f.id,{spd:9+i*2,dmg:45,w:28,h:28,col:'#88ddff',glow:'#ccffff',type:'i',life:75})),i*100)}
    if(which===S.S2&&f.cn==='ZERO'){f._teleporting=true;f.inv=30}
  }
}

// ── Collision ──────────────────────────────────────────────
function ov(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function hitCheck(atk,def,pts,sfx){

  const hurt=def.hurt;if(!hurt)return;
  for(const hb of atk.hbs){
    if(ov(hb,hurt)){const m=atk.mv;if(!m)continue;
      if(def.recHit(m,atk.fr,pts)){
        atk.hmv=true;atk.hcnt++;atk.lhT=atk.sT;atk.en=Math.min(atk.men,atk.en+m.dmg*.07);
        def.cb++;def.cbdmg+=m.dmg;def.cbT=95;
        const big=m.p.sup,med=m.dmg>=150;

        else if(med){sfx.shake(6,11);sfx.hitStop(5)}

  }
  for(const p of atk.projs){if(!p.active)continue;if(ov(p.hb,hurt)){

// ── Stage ──────────────────────────────────────────────────
class Stage{
  constructor(){this.T=0;this.stars=[];this.blds=[];
    for(let i=0;i<90;i++)this.stars.push({x:(i*137.5+50)%W,y:(i*73.1+20)%(H*.5),r:.3+Math.random()*.9,p:Math.random()*Math.PI*2,sp:.8+Math.random()*1.4});
    for(let i=0;i<22;i++){const x=(i*53+30)%(W+100)-50,w=30+(i*41)%55,h=55+(i*59)%180,c=['#0e0028','#140038','#0a0020','#180048'][i%4];
      const wins=[];for(let wx=0;wx<Math.floor(w/11);wx++)for(let wy=0;wy<Math.floor(h/18);wy++)if((i+wx+wy)%3!==0)wins.push({wx,wy,col:['#3cf','#f46','#4f8','#aa4'][((i+wx)%4)]});
      this.blds.push({x,w,h,c,wins,neon:i%3===0,nc:i%2===0?'#f46':'#3bf'});}
  }
  tick(){this.T+=1/60}
  draw(ctx){
    const T=this.T;
    const sk=ctx.createLinearGradient(0,0,0,H);sk.addColorStop(0,'#010008');sk.addColorStop(.5,'#040018');sk.addColorStop(1,'#0c0028');
    ctx.fillStyle=sk;ctx.fillRect(0,0,W,H);
    for(const s of this.stars){ctx.globalAlpha=.15+Math.sin(T*s.sp+s.p)*.18;ctx.fillStyle='#ddeeff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}
    ctx.globalAlpha=1;
    const mg=ctx.createRadialGradient(W*.78,45,0,W*.78,45,40);mg.addColorStop(0,'rgba(200,180,255,.28)');mg.addColorStop(1,'rgba(160,120,255,0)');
    ctx.fillStyle=mg;ctx.beginPath();ctx.arc(W*.78,45,40,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(180,140,255,.5)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(W*.78,45,25,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='#0c0022';ctx.beginPath();ctx.moveTo(0,H*.72);
    for(let x=0;x<=W;x+=16){ctx.lineTo(x,H*.62-Math.sin(x/W*11+.5)*42-Math.sin(x/W*4.5+1)*60)}
    ctx.lineTo(W,H*.72);ctx.closePath();ctx.fill();
    for(const b of this.blds){const by=FLOOR-b.h+8;ctx.fillStyle=b.c;ctx.fillRect(b.x,by,b.w,b.h+FLOOR-by+10);
      for(const w of b.wins){ctx.globalAlpha=.15+Math.sin(T*(1.2+w.wx*.05+w.wy*.03)+w.wx+w.wy*.6)*.18;ctx.fillStyle=w.col;ctx.fillRect(b.x+w.wx*10+3,by+w.wy*17+4,6,9)}
      ctx.globalAlpha=1;
      if(b.neon){ctx.strokeStyle=b.nc;ctx.lineWidth=2;ctx.globalAlpha=.45+Math.sin(T*3.5+b.x*.01)*.35;ctx.shadowBlur=10;ctx.shadowColor=b.nc;ctx.strokeRect(b.x+4,by+10,b.w-8,12);ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.fillStyle=b.nc+'44';ctx.fillRect(b.x+6,by+12,b.w-12,8)}
      if(b.h>120){ctx.strokeStyle='#3a2060';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(b.x+b.w/2,by);ctx.lineTo(b.x+b.w/2,by-18);ctx.stroke();const bc=(T*2+b.x)%3<1.5?'#ff2':'#200';ctx.fillStyle=bc;ctx.beginPath();ctx.arc(b.x+b.w/2,by-20,2.5,0,Math.PI*2);ctx.fill()}
    }
    const fg=ctx.createLinearGradient(0,FLOOR,0,H);fg.addColorStop(0,'#1a0050');fg.addColorStop(.5,'#0a0028');fg.addColorStop(1,'#050010');
    ctx.fillStyle=fg;ctx.fillRect(0,FLOOR,W,H-FLOOR);
    ctx.strokeStyle='#8040ff';ctx.lineWidth=3;ctx.shadowBlur=22;ctx.shadowColor='#8040ff';ctx.globalAlpha=.8;ctx.beginPath();ctx.moveTo(0,FLOOR);ctx.lineTo(W,FLOOR);ctx.stroke();ctx.shadowBlur=0;ctx.globalAlpha=1;
    for(let gy=FLOOR+20;gy<H;gy+=24){ctx.strokeStyle='#4020a0';ctx.lineWidth=.8;ctx.globalAlpha=.1+.22*(gy-FLOOR)/(H-FLOOR);ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke()}
    for(let i=0;i<=16;i++){ctx.globalAlpha=.1;ctx.strokeStyle='#4020a0';ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(W/2+(i/16-.5)*W*.28,FLOOR);ctx.lineTo(i/16*W,H);ctx.stroke()}
    ctx.globalAlpha=1;
  }
}

// ── UI ─────────────────────────────────────────────────────
class UI{
  hBar(ctx,f,x,y,bw,flip,T){
    const r=f.hp/f.mhp,dr=f.dhp/f.mhp,bx=flip?x-bw:x;
    ctx.fillStyle='#100020';ctx.strokeStyle='#6040c0';ctx.lineWidth=2;ctx.beginPath();rr(ctx,bx-2,y-2,bw+4,24,5);ctx.fill();ctx.stroke();
    ctx.strokeStyle='rgba(160,80,255,.3)';ctx.lineWidth=1;ctx.beginPath();rr(ctx,bx-3,y-3,bw+6,26,6);ctx.stroke();
    if(dr>r){const lw=bw*dr,lx=flip?bx+bw-lw:bx;ctx.fillStyle='#c09010';ctx.beginPath();rr(ctx,lx,y,lw,20,3);ctx.fill()}
    const col=r>.5?'#00ff80':r>.25?'#ffcc00':'#ff2040';
    const hw=bw*r,hx=flip?bx+bw-hw:bx;
    ctx.shadowBlur=10;ctx.shadowColor=col;ctx.fillStyle=col;ctx.beginPath();rr(ctx,hx,y,hw,20,3);ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,.22)';ctx.beginPath();rr(ctx,hx,y,hw,7,2);ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=1;for(let i=1;i<10;i++){const nx=bx+bw*i/10;ctx.beginPath();ctx.moveTo(nx,y);ctx.lineTo(nx,y+20);ctx.stroke()}
  }
  eBar(ctx,f,x,y,bw,flip){
    const r=f.en/f.men,bx=flip?x-bw:x,full=r>=1;
    ctx.fillStyle='#04001a';ctx.strokeStyle='#2030a0';ctx.lineWidth=1.5;ctx.beginPath();rr(ctx,bx-1,y-1,bw+2,14,3);ctx.fill();ctx.stroke();
    const ec=full?'#ffe030':'#2060ff';ctx.shadowBlur=full?16:5;ctx.shadowColor=ec;ctx.fillStyle=ec;ctx.beginPath();rr(ctx,bx,y,bw*r,12,2);ctx.fill();ctx.shadowBlur=0;
    ctx.strokeStyle='rgba(0,0,30,.6)';ctx.lineWidth=1;for(let i=1;i<4;i++){ctx.beginPath();ctx.moveTo(bx+bw*i/4,y);ctx.lineTo(bx+bw*i/4,y+12);ctx.stroke()}
  }
  timer(ctx,sec,T){
    const urg=sec<=10,cx=W/2;ctx.save();
    ctx.fillStyle=urg?'#2a000a':'#080020';ctx.strokeStyle=urg?'#cc2040':'#6040c0';ctx.lineWidth=2;ctx.beginPath();rr(ctx,cx-34,3,68,40,7);ctx.fill();ctx.stroke();
    ctx.textAlign='center';ctx.font=`bold 32px 'Courier New',monospace`;ctx.fillStyle=urg?'#ff4060':'#ffffff';ctx.shadowBlur=urg?22:10;ctx.shadowColor=urg?'#ff1030':'#8040ff';
    ctx.fillText(String(sec).padStart(2,'0'),cx,30);ctx.restore();
  }
  wins(ctx,n,max,x,y,col,flip){
    for(let i=0;i<Math.ceil(max/2);i++){const ix=flip?x-(i+1)*22:x+i*22;ctx.fillStyle=i<n?col:'#1a0830';ctx.strokeStyle=col+'80';ctx.lineWidth=1.5;ctx.shadowBlur=i<n?10:0;ctx.shadowColor=col;ctx.beginPath();ctx.arc(ix+8,y+8,8,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.shadowBlur=0}
  }
  combo(ctx,f,x,y,flip,T){
    if(f.cb<2)return;ctx.save();ctx.textAlign=flip?'right':'left';const s=1+Math.min(f.cb,10)*.045;ctx.translate(x,y);ctx.scale(s,s);
    ctx.font=`bold 46px Impact,sans-serif`;ctx.strokeStyle='#000';ctx.lineWidth=5;ctx.strokeText(f.cb+' HIT',0,0);ctx.fillStyle='#ffd020';ctx.shadowBlur=20;ctx.shadowColor='#ff8800';ctx.fillText(f.cb+' HIT',0,0);
    ctx.font=`bold 14px 'Courier New',monospace`;ctx.fillStyle='#ffaa40';ctx.shadowBlur=8;ctx.fillText(f.cbdmg+' DMG',0,20);ctx.restore();
  }
  draw(ctx,p1,p2,tim,p1w,p2w,mr,T){
    const BW=340;
    this.hBar(ctx,p1,35,20,BW,false,T);this.hBar(ctx,p2,W-35,20,BW,true,T);
    this.eBar(ctx,p1,35,47,BW*.58,false);this.eBar(ctx,p2,W-35,47,BW*.58,true);
    this.timer(ctx,tim,T);
    this.wins(ctx,p1w,mr,35,64,p1.C.col,false);this.wins(ctx,p2w,mr,W-35,64,p2.C.col,true);
    ctx.save();ctx.font=`bold 11px 'Courier New',monospace`;ctx.shadowBlur=6;
    ctx.textAlign='left';ctx.fillStyle=p1.C.col;ctx.shadowColor=p1.C.glow;ctx.fillText(p1.C.name,35,14);
    ctx.textAlign='right';ctx.fillStyle=p2.C.col;ctx.shadowColor=p2.C.glow;ctx.fillText(p2.C.name,W-35,14);ctx.restore();
    this.combo(ctx,p1,90,295,false,T);this.combo(ctx,p2,W-90,295,true,T);
    if(p1.en>=p1.men){const a=.5+Math.sin(T*6)*.5;ctx.save();ctx.globalAlpha=a;ctx.font=`bold 10px 'Courier New',monospace`;ctx.fillStyle='#ffe040';ctx.shadowBlur=14;ctx.shadowColor='#ffaa00';ctx.textAlign='left';ctx.fillText('★ SUPER ★',36,80);ctx.restore()}
    if(p2.en>=p2.men){const a=.5+Math.sin(T*6)*.5;ctx.save();ctx.globalAlpha=a;ctx.font=`bold 10px 'Courier New',monospace`;ctx.fillStyle='#ffe040';ctx.shadowBlur=14;ctx.shadowColor='#ffaa00';ctx.textAlign='right';ctx.fillText('★ SUPER ★',W-36,80);ctx.restore()}
  }
  bigText(ctx,t,x,y,col='#fff',sz=70){ctx.save();ctx.textAlign='center';ctx.font=`bold ${sz}px Impact,sans-serif`;ctx.strokeStyle='#000';ctx.lineWidth=8;ctx.strokeText(t,x,y);ctx.fillStyle=col;ctx.shadowBlur=30;ctx.shadowColor=col;ctx.fillText(t,x,y);ctx.restore()}
}

// ── GAME ───────────────────────────────────────────────────
class Game{
  constructor(){
    const cv=document.getElementById('c');cv.width=W;cv.height=H;
    const rsz=()=>{const sc=Math.min(window.innerWidth/W,window.innerHeight/H);cv.style.width=W*sc+'px';cv.style.height=H*sc+'px'};
    rsz();window.addEventListener('resize',rsz);window.addEventListener('orientationchange',()=>setTimeout(rsz,300));
    // Pointer lock
    const lk=()=>{const r=cv.requestPointerLock||cv.webkitRequestPointerLock;if(r)r.call(cv).catch(()=>{})};
    cv.addEventListener('click',lk);
    this.ctx=cv.getContext('2d');
    this.pts=new Pts();this.sfx=new SFX();this.stage=new Stage();this.ui=new UI();
    this.mim=new Input();
    // ── State machine ──
    this.state='MENU'; // MENU CHARSEL INTRO FIGHT RE ME
    this.round=1;this.mr=3;this.p1w=0;this.p2w=0;
    this.timer=99;this.tf=0;this.annT='';this.annF=0;this.annC='#fff';
    this.introF=0;this.reF=0;this.T=0;
    // Character select
    this.chars=Object.keys(CHARS);
    this.p1sel=0;this.p2sel=1;this.curSel=0; // 0=p1 choosing
    this.diff=2; // 1-3
    this._touchStart=false;
    cv.addEventListener('touchstart',e=>{
      this._touchStart=true;
      if(this.state==='CHARSEL'){
        const sc=Math.min(window.innerWidth/W,window.innerHeight/H);
        const rect=cv.getBoundingClientRect();
        const t=e.touches[0];
        const tx=(t.clientX-rect.left)/sc,ty=(t.clientY-rect.top)/sc;
        // Flèche gauche zone
        if(tx<200) this._selBtn='L';
        // Flèche droite zone
        else if(tx>W-200) this._selBtn='R';
        // Bouton confirmer bas
        else if(ty>H-70) this._selBtn='A';
        e.preventDefault();
      }
    },{passive:false});
    this._build();
    requestAnimationFrame(ts=>this._loop(ts));
    if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));
    if('wakeLock' in navigator)navigator.wakeLock.request('screen').catch(()=>{});
  }
  _build(){
    const cn1=this.chars[this.p1sel],cn2=this.chars[this.p2sel];
    this.p1=new Fighter(1,cn1,240,true,true);
    this.p2=new Fighter(2,cn2,720,false,false);
    this.ai=new AI(this.p2,this.diff);
  }
  _reset(){
    const r=(f,x,fr)=>{Object.assign(f,{x,y:FLOOR,hp:f.mhp,dhp:f.mhp,en:0,vx:0,vy:0,st:S.I,sT:0,cb:0,cbdmg:0,cbT:0,inv:0,hf:0,hmv:false,frozen:0,_teleporting:false});f.projs=[];f.aimgs=[];f.fr=fr};
    r(this.p1,240,true);r(this.p2,720,false);
    this.timer=99;this.tf=0;this.pts.list=[];
  }
  ann(t,c='#fff',d=120){this.annT=t;this.annF=d;this.annC=c}

  _loop(ts){
    requestAnimationFrame(ts2=>this._loop(ts2));
    this.T=ts/1000;this.sfx.tick();this.stage.tick();this.mim.flush();
    if(!this.sfx.frozen)this._update();
    this._draw();
  }
  _anyKey(){return this.mim.p.size>0||this.mim.pk('GA')||this.mim.pk('GJ')||this.mim.pk('GST')||this._touchStart||TC.atk}
  _update(){
    if(this._touchStart)this._touchStart=false;
    switch(this.state){
      case 'MENU':if(this._anyKey()){this.state='CHARSEL'}break;
      case 'CHARSEL':this._charSelUpdate();break;
      case 'INTRO':if(--this.introF<=0){this.state='FIGHT';this.ann('FIGHT !','#ffe020',55)}break;
      case 'FIGHT':this._fight();break;
      case 'RE':if(--this.reF<=0){if(this.p1w>=Math.ceil(this.mr/2)||this.p2w>=Math.ceil(this.mr/2)){this.state='ME'}else{this.round++;this.state='INTRO';this.introF=130;this._reset()}}break;
      case 'ME':if(this._anyKey()){this.round=1;this.p1w=0;this.p2w=0;this.state='MENU'}break;
    }
  }
  _charSelUpdate(){
    const im=this.mim;
    // Cooldown pour eviter double input
    if(!this._selCd)this._selCd=0;
    this._selCd--;
    const left =this._selCd<=0&&(im.pk(KB.l)||im.pk('GL')||this._selBtn==='L');
    const right=this._selCd<=0&&(im.pk(KB.r)||im.pk('GR')||this._selBtn==='R');
    const atk  =im.pk(KB.a)||im.pk('GA')||this._selBtn==='A';
    this._selBtn=null;TC.left=TC.right=TC.atk=false;
    if(left||right){this._selCd=12}
    if(this.curSel===0){
      if(left) this.p1sel=(this.p1sel-1+this.chars.length)%this.chars.length;
      if(right)this.p1sel=(this.p1sel+1)%this.chars.length;
      if(atk)  this.curSel=1;
    } else {
      if(left) this.p2sel=(this.p2sel-1+this.chars.length)%this.chars.length;
      if(right)this.p2sel=(this.p2sel+1)%this.chars.length;
      if(atk){this._build();this._reset();this.state='INTRO';this.introF=160;this.curSel=0}
    }
  }
  _fight(){
    if(++this.tf>=60){this.tf=0;this.timer--}
    if(this.timer<=0){this._endRound();return}
    this.p1.handleInput(this.p2);this.ai.tick(this.p1,this.pts);
    if(this.p1.st===S.SU&&this.p1.sT===20){this.sfx.slow(90);this.sfx.flash(this.p1.C.col,.7,16);this.sfx.shake(11,25)}
    if(this.p2.st===S.SU&&this.p2.sT===18){this.sfx.slow(90);this.sfx.flash(this.p2.C.col,.7,16);this.sfx.shake(11,25)}
    const skip=this.sfx.slowing&&Math.random()<.52;
    if(!skip){this.p1.tick(this.p2,this.pts);this.p2.tick(this.p1,this.pts)}
    hitCheck(this.p1,this.p2,this.pts,this.sfx);hitCheck(this.p2,this.p1,this.pts,this.sfx);
    if(!skip)this.pts.tick();
    if(this.annF>0)this.annF--;
    if(this.p1.hp<=0||this.p2.hp<=0)this._endRound();
  }
  _endRound(){
    if(this.state!=='FIGHT')return;
    // CORRECTION BUG : le joueur avec PLUS de HP gagne
    const p1hp=this.p1.hp,p2hp=this.p2.hp;
    if(p1hp>p2hp){this.p1w++;this.ann('TU GAGNES !',this.p1.C.col,200)}
    else if(p2hp>p1hp){this.p2w++;this.ann('DÉFAITE...',this.p2.C.col,200)}
    else this.ann('ÉGALITÉ !','#ffa020',180);
    this.sfx.shake(14,22);this.sfx.flash('#fff',.45,10);this.state='RE';this.reF=200;
  }
  _draw(){
    const ctx=this.ctx;ctx.clearRect(0,0,W,H);
    // Ecrans sans jeu en fond
    if(this.state==='MENU'){this._drawMenu(ctx);return}
    if(this.state==='CHARSEL'){this._drawCharSel(ctx);return}
    // Ecrans de combat
    ctx.save();this.sfx.apply(ctx);
    this.stage.draw(ctx);
    for(const f of[this.p1,this.p2])if(f.st===S.SU)this._superAura(f);
    this.p1.draw(ctx,this.pts,this.T);this.p2.draw(ctx,this.pts,this.T);
    this.pts.draw(ctx);ctx.restore();this.sfx.drawFlash(ctx);
    this.ui.draw(ctx,this.p1,this.p2,this.timer,this.p1w,this.p2w,this.mr,this.T);
    if(this.annF>0){const a=this.annF>30?1:this.annF/30;ctx.save();ctx.globalAlpha=a;this.ui.bigText(ctx,this.annT,W/2,H/2+24,this.annC);ctx.restore()}
    if(this.state==='INTRO')this._drawIntro(ctx);
    if(this.state==='ME')this._drawMatchEnd(ctx);
  }
  _superAura(f){
    const ctx=this.ctx,C=f.C,T=this.T;ctx.save();
    for(let i=3;i>=0;i--){const r=55+i*20+Math.sin(T*12+i)*8;ctx.globalAlpha=(.3-i*.06)*(f.sT%8<4?1:.55);ctx.strokeStyle=C.glow;ctx.lineWidth=2.5-i*.4;ctx.shadowBlur=16;ctx.shadowColor=C.glow;ctx.beginPath();ctx.arc(f.x,f.y-f.h*.5,r,0,Math.PI*2);ctx.stroke()}
    ctx.restore();if(Math.random()<.75)this.pts.burst(f.x,f.y-f.h*.55,3,[C.glow,C.col,'#fff'],8,[2,5]);
  }
  _drawMenu(ctx){
    const T=this.T;
    ctx.fillStyle='rgba(1,0,14,.78)';ctx.fillRect(0,0,W,H);
    ctx.save();ctx.textAlign='center';
    const tg=ctx.createLinearGradient(W/2-240,0,W/2+240,0);tg.addColorStop(0,'#2ee8ff');tg.addColorStop(.5,'#ffffff');tg.addColorStop(1,'#ff5522');
    ctx.font=`bold 96px Impact,sans-serif`;ctx.strokeStyle='#000';ctx.lineWidth=10;ctx.strokeText('NOVA CLASH',W/2,178);ctx.fillStyle=tg;ctx.shadowBlur=38;ctx.shadowColor='#8040ff';ctx.fillText('NOVA CLASH',W/2,178);
    ctx.font=`13px 'Courier New',monospace`;ctx.fillStyle='#8060b0';ctx.shadowBlur=0;ctx.fillText('3 PERSONNAGES · 3 ROUNDS · COMBOS & SUPERS',W/2,210);
    // Preview chars
    const cnames=this.chars;
    cnames.forEach((cn,i)=>{
      const C=CHARS[cn],bx=W/2+(i-1)*240;
      ctx.fillStyle='rgba(10,0,30,.65)';ctx.strokeStyle=C.col+'80';ctx.lineWidth=1.5;ctx.beginPath();rr(ctx,bx-90,240,180,110,8);ctx.fill();ctx.stroke();
      ctx.textAlign='center';ctx.font=`bold 18px 'Courier New',monospace`;ctx.fillStyle=C.col;ctx.shadowBlur=8;ctx.shadowColor=C.glow;ctx.fillText(C.name,bx,270);
      ctx.font=`10px 'Courier New',monospace`;ctx.fillStyle='#7060a0';ctx.shadowBlur=0;ctx.fillText(C.sub,bx,288);
      C.desc.slice(0,3).forEach((d,j)=>{ctx.fillStyle='#6050a0';ctx.font=`9px 'Courier New',monospace`;ctx.fillText(d,bx,304+j*12)});
    });
    const p=.5+Math.sin(T*3.5)*.5;ctx.globalAlpha=p;ctx.font=`bold 20px 'Courier New',monospace`;ctx.fillStyle='#ffe020';ctx.shadowBlur=18;ctx.shadowColor='#ffaa00';ctx.fillText('— APPUYER POUR COMMENCER —',W/2,420);
    ctx.globalAlpha=1;ctx.font=`11px 'Courier New',monospace`;ctx.fillStyle='#4030a0';ctx.fillText('Q/D=bouger  Z=sauter  S=accroupir  R=attaquer  ↑SP=sp2  ↓SP=sp3  SUP=super',W/2,455);
    ctx.restore();
  }
  _drawCharSel(ctx){
    const T=this.T;
    const phase=this.curSel; // 0=P1 choisit, 1=adversaire
    const curIdx=phase===0?this.p1sel:this.p2sel;
    const C=CHARS[this.chars[curIdx]];
    const accentCol=phase===0?'#2ee8ff':'#ff5522';

    // Fond full
    ctx.fillStyle='#030010';ctx.fillRect(0,0,W,H);
    // Gradient latéral de couleur perso
    const bg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W*.7);
    bg.addColorStop(0,C.col+'18');bg.addColorStop(1,'#030010');
    ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    // Ligne déco haut
    ctx.fillStyle=accentCol;ctx.fillRect(0,0,W,3);
    ctx.shadowBlur=12;ctx.shadowColor=accentCol;ctx.fillRect(0,0,W,3);ctx.shadowBlur=0;

    // Titre phase
    ctx.save();ctx.textAlign='center';
    ctx.font=`bold 13px 'Courier New',monospace`;ctx.fillStyle=accentCol;ctx.letterSpacing='4px';
    ctx.fillText(phase===0?'— JOUEUR 1 —':'— ADVERSAIRE —',W/2,28);
    ctx.font=`bold 28px Impact,sans-serif`;ctx.fillStyle='#fff';ctx.shadowBlur=14;ctx.shadowColor=accentCol;
    ctx.fillText(phase===0?"CHOISISSEZ VOTRE PERSONNAGE":"CHOISISSEZ L'ADVERSAIRE",W/2,58);ctx.restore();

    // Carte centrale (personnage selectionné)
    const cx=W/2,cy=H/2+20;
    // Halo
    const halo=ctx.createRadialGradient(cx,cy,0,cx,cy,200);
    halo.addColorStop(0,C.col+'22');halo.addColorStop(1,'transparent');
    ctx.fillStyle=halo;ctx.beginPath();ctx.arc(cx,cy,200,0,Math.PI*2);ctx.fill();
    // Cadre carte
    ctx.fillStyle='rgba(8,0,28,.92)';ctx.strokeStyle=C.col;ctx.lineWidth=2;
    ctx.shadowBlur=20;ctx.shadowColor=C.col;
    ctx.beginPath();rr(ctx,cx-200,cy-155,400,310,14);ctx.fill();ctx.stroke();ctx.shadowBlur=0;
    // Nom
    ctx.save();ctx.textAlign='center';
    ctx.font=`bold 42px Impact,sans-serif`;ctx.strokeStyle='#000';ctx.lineWidth=6;ctx.strokeText(C.name,cx,cy-95);
    ctx.fillStyle=C.col;ctx.shadowBlur=18;ctx.shadowColor=C.glow;ctx.fillText(C.name,cx,cy-95);
    ctx.font=`12px 'Courier New',monospace`;ctx.fillStyle=C.glow;ctx.shadowBlur=0;ctx.fillText(C.sub,cx,cy-72);
    // Séparateur
    ctx.strokeStyle=C.col+'66';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx-160,cy-58);ctx.lineTo(cx+160,cy-58);ctx.stroke();
    // Capacités
    ctx.font=`11px 'Courier New',monospace`;
    C.desc.forEach((d,j)=>{
      ctx.fillStyle=j===0?C.glow:j===1?'#aaddff':j===2?'#ffddaa':'#ffff88';
      const icons=['⚡','🔥','❄️','★'];
      ctx.fillText(icons[j%4]+' '+d,cx,cy-38+j*22);
    });
    // Barre HP
    ctx.fillStyle='#1a0040';ctx.beginPath();rr(ctx,cx-150,cy+60,300,14,4);ctx.fill();
    ctx.fillStyle=C.col;ctx.shadowBlur=6;ctx.shadowColor=C.col;ctx.beginPath();rr(ctx,cx-150,cy+60,300*(C.hp/1000),14,4);ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='#888';ctx.font=`10px 'Courier New',monospace`;ctx.fillText('HP : '+C.hp,cx,cy+88);
    ctx.restore();

    // Flèches gauche/droite avec les autres persos
    const prev=(curIdx-1+this.chars.length)%this.chars.length;
    const next=(curIdx+1)%this.chars.length;
    const Cp=CHARS[this.chars[prev]],Cn=CHARS[this.chars[next]];
    // Carte gauche
    ctx.save();ctx.globalAlpha=.5;ctx.fillStyle='rgba(8,0,28,.8)';ctx.strokeStyle=Cp.col+'66';ctx.lineWidth=1.5;
    ctx.beginPath();rr(ctx,50,cy-80,130,160,10);ctx.fill();ctx.stroke();
    ctx.textAlign='center';ctx.font=`bold 16px Impact,sans-serif`;ctx.fillStyle=Cp.col;ctx.fillText(Cp.name,115,cy-40);
    ctx.font=`9px 'Courier New',monospace`;ctx.fillStyle='#666';ctx.fillText(Cp.sub,115,cy-22);ctx.restore();
    // Flèche gauche
    ctx.save();ctx.fillStyle='#fff';ctx.font=`bold 28px Impact`;ctx.textAlign='center';ctx.globalAlpha=.6+Math.sin(T*3)*.25;ctx.fillText('◀',85,cy+8);ctx.restore();
    // Carte droite
    ctx.save();ctx.globalAlpha=.5;ctx.fillStyle='rgba(8,0,28,.8)';ctx.strokeStyle=Cn.col+'66';ctx.lineWidth=1.5;
    ctx.beginPath();rr(ctx,W-180,cy-80,130,160,10);ctx.fill();ctx.stroke();
    ctx.textAlign='center';ctx.font=`bold 16px Impact,sans-serif`;ctx.fillStyle=Cn.col;ctx.fillText(Cn.name,W-115,cy-40);
    ctx.font=`9px 'Courier New',monospace`;ctx.fillStyle='#666';ctx.fillText(Cn.sub,W-115,cy-22);ctx.restore();
    // Flèche droite
    ctx.save();ctx.fillStyle='#fff';ctx.font=`bold 28px Impact`;ctx.textAlign='center';ctx.globalAlpha=.6+Math.sin(T*3+1)*.25;ctx.fillText('▶',W-85,cy+8);ctx.restore();

    // Bouton confirmer
    const pulse=.7+Math.sin(T*4)*.3;
    ctx.save();ctx.globalAlpha=pulse;ctx.fillStyle=accentCol+'44';ctx.strokeStyle=accentCol;ctx.lineWidth=2;ctx.shadowBlur=14;ctx.shadowColor=accentCol;
    ctx.beginPath();rr(ctx,W/2-100,H-58,200,36,18);ctx.fill();ctx.stroke();
    ctx.textAlign='center';ctx.font=`bold 14px 'Courier New',monospace`;ctx.fillStyle='#fff';ctx.shadowBlur=8;
    ctx.fillText(phase===0?'CONFIRMER  →':'LANCER LE COMBAT  ⚔',W/2,H-34);ctx.restore();

    // Si P1 déjà choisi
    if(phase===1){
      const C1=CHARS[this.chars[this.p1sel]];
      ctx.save();ctx.textAlign='left';ctx.font=`bold 11px 'Courier New',monospace`;
      ctx.fillStyle=C1.col;ctx.shadowBlur=6;ctx.shadowColor=C1.glow;
      ctx.fillText('TON PERSO : '+C1.name,28,H-12);ctx.restore();
    }
    // Touches clavier
    ctx.save();ctx.textAlign='right';ctx.font=`9px 'Courier New',monospace`;ctx.fillStyle='#3a2060';
    ctx.fillText('Q/D = naviguer   R = confirmer',W-20,H-8);ctx.restore();

    // Boutons tactiles charsel (invisibles pour input)
    if(!this._csEl){
      this._csEl=true;
      // On crée des zones tactiles invisibles
    }
  }
  _drawIntro(ctx){
    const p=1-this.introF/160;ctx.fillStyle='rgba(1,0,14,.55)';ctx.fillRect(0,0,W,H);
    const a=Math.min(1,p*2.8),os=Math.max(0,1-p*2)*80;
    ctx.save();ctx.globalAlpha=a;ctx.font=`bold 32px 'Courier New',monospace`;
    ctx.textAlign='left';ctx.fillStyle=this.p1.C.col;ctx.shadowBlur=16;ctx.shadowColor=this.p1.C.glow;ctx.fillText(this.p1.C.name,55-os,H-50);
    ctx.textAlign='right';ctx.fillStyle=this.p2.C.col;ctx.shadowColor=this.p2.C.glow;ctx.fillText(this.p2.C.name,W-55+os,H-50);ctx.restore();
    if(this.introF<55){const ra=Math.min(1,(55-this.introF)/18);ctx.save();ctx.globalAlpha=ra;ctx.textAlign='center';ctx.font=`bold 56px Impact,sans-serif`;ctx.strokeStyle='#000';ctx.lineWidth=6;ctx.strokeText(`ROUND ${this.round}`,W/2,H/2);ctx.fillStyle='#fff';ctx.shadowBlur=28;ctx.shadowColor='#8040ff';ctx.fillText(`ROUND ${this.round}`,W/2,H/2);ctx.restore()}
  }
  _drawMatchEnd(ctx){
    const T=this.T;ctx.fillStyle='rgba(1,0,14,.88)';ctx.fillRect(0,0,W,H);
    const win=this.p1w>this.p2w?this.p1:this.p2;const lose=win===this.p1?this.p2:this.p1;
    ctx.save();ctx.textAlign='center';
    ctx.font=`bold 90px Impact,sans-serif`;ctx.strokeStyle='#000';ctx.lineWidth=9;ctx.strokeText('K.O.',W/2,195);ctx.fillStyle='#ff2040';ctx.shadowBlur=38;ctx.shadowColor='#ff0020';ctx.fillText('K.O.',W/2,195);
    ctx.font=`bold 46px Impact,sans-serif`;ctx.strokeStyle='#000';ctx.lineWidth=5;ctx.strokeText(win.C.name+' GAGNE !',W/2,260);ctx.fillStyle=win.C.col;ctx.shadowColor=win.C.glow;ctx.fillText(win.C.name+' GAGNE !',W/2,260);
    ctx.font=`14px 'Courier New',monospace`;ctx.fillStyle='#7060a0';ctx.shadowBlur=0;ctx.fillText(`${this.p1.C.name}: ${this.p1w}V  ·  ${this.p2.C.name}: ${this.p2w}V`,W/2,306);
    const p=.5+Math.sin(T*3)*.5;ctx.globalAlpha=p;ctx.font=`16px 'Courier New',monospace`;ctx.fillStyle='#aaa';ctx.fillText('APPUYER POUR REJOUER',W/2,380);ctx.restore();
  }
}
window.addEventListener('load',()=>{
  new Game();
  const goFS=()=>{const el=document.documentElement,r=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen;if(r)r.call(el).catch(()=>{})};
  document.addEventListener('touchstart',goFS,{once:true});document.addEventListener('click',goFS,{once:true});
});
</script>
</body>
